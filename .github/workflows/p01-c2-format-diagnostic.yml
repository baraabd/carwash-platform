name: P01-C2 formatting diagnostic
on:
  push:
    branches: ['prod/p01-c2-workforce-provider']
    paths: ['.github/workflows/p01-c2-format-diagnostic.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier \
            services/workforce/src/app.module.ts \
            services/workforce/src/application/authorization.ts \
            services/workforce/src/application/workforce.service.ts \
            services/workforce/src/domain/operator.ts \
            services/workforce/src/domain/verification.ts \
            services/workforce/src/infrastructure/persistence/prisma-workforce.store.ts \
            services/workforce/src/ports/index.ts \
            services/workforce/src/transport/http/http-errors.ts \
            services/workforce/src/transport/http/workforce.controller.ts \
            services/workforce/test/workforce.domain.spec.ts \
            services/workforce/test/workforce.edge.spec.ts \
            --write
          git diff -- \
            services/workforce/src/app.module.ts \
            services/workforce/src/application/authorization.ts \
            services/workforce/src/application/workforce.service.ts \
            services/workforce/src/domain/operator.ts \
            services/workforce/src/domain/verification.ts \
            services/workforce/src/infrastructure/persistence/prisma-workforce.store.ts \
            services/workforce/src/ports/index.ts \
            services/workforce/src/transport/http/http-errors.ts \
            services/workforce/src/transport/http/workforce.controller.ts \
            services/workforce/test/workforce.domain.spec.ts \
            services/workforce/test/workforce.edge.spec.ts
