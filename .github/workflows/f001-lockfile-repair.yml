name: Temporary F001 lockfile repair
on:
  push:
    branches: [feat/F001-monorepo-ownership]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare --activate
      - name: Regenerate lockfile from current manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Show lockfile diff
        run: git diff -- pnpm-lock.yaml
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches current manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(lockfile): regenerate after F001/F002 reconciliation"
          git push origin HEAD:feat/F001-monorepo-ownership
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regenerated-f001-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
