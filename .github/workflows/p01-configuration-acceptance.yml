name: P01 configuration acceptance
on:
  pull_request:
    paths:
      - 'services/configuration/**'
      - 'packages/service-kit/**'
      - 'packages/contracts/**'
      - 'scripts/production/D/**'
      - 'scripts/acceptance/**'
      - 'scripts/dev/acceptance-infra.mjs'
      - 'tests/production/D/configuration-revisions.test.mjs'
      - 'infra/postgres/**'
      - 'infra/compose.acceptance.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/p01-configuration-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p01-configuration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: Configuration lifecycle and PostgreSQL invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned tools and frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          node scripts/verify-toolchain.mjs
          pnpm install --frozen-lockfile
      - name: Build the current source and run configuration unit tests
        run: |
          set -euo pipefail
          pnpm generate
          pnpm build
          pnpm --filter @carwash/configuration build:tests
          node --test services/configuration/dist-tests/test/*.spec.js
      - name: Start disposable PostgreSQL and broker
        run: node scripts/dev/acceptance-infra.mjs up
      - name: Verify real configuration lifecycle, snapshots and append-only grants
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p01-configuration"
          node scripts/production/D/run-real-infra.mjs --suite configuration --evidence "$RUNNER_TEMP/p01-configuration/result.json"
          git diff --exit-code
      - name: Stop the owned disposable stack
        if: always()
        run: |
          if test -f .acceptance/current-dev-stack.json; then
            node scripts/dev/acceptance-infra.mjs down
          fi
      - name: Retain bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-configuration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p01-configuration/result.json
          if-no-files-found: warn
          retention-days: 14
