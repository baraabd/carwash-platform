name: F009 verified source objects only
on:
  push:
    branches: ['work/F009-source-objects-20260927']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a08a7894e62cbca71bca409af7c334d703b7700
          persist-credentials: false
      - name: Verify exact patch and preserve source modes and immutable references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          parent='7a08a7894e62cbca71bca409af7c334d703b7700'
          base_tree='2a678ba3b21f4b19236f3202ca8647392d5e2946'
          expected='5f6b1c9b6a71de2a9e05a72ce53a645e2c621371'
          def api(path, data=None):
              request=urllib.request.Request('https://api.github.com/repos/baraabd/carwash-platform'+path, data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          data=base64.b64decode(api('/git/blobs/c3d6777ed757fc008d5afba4d19c7c7f375f4eb4')['content'])
          assert len(data)==4516 and hashlib.sha256(data).hexdigest()=='8501c01bece63ca56f771e9e5708ba66903340638fa15170933ee3d0e0064ce0'
          patch=lzma.decompress(data,memlimit=268435456)
          assert len(patch)==13270
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==parent
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==12
          manifest=json.loads(pathlib.Path('docs/design/reference-manifest.json').read_text())
          forbidden=set(manifest['frozenPolicyPaths'])|{i['path'] for i in manifest['artifacts']}
          entries=[]
          for path in paths:
              assert path not in forbidden and not path.startswith(('design/','.env','.claude/','.github/workflows/'))
              assert '..' not in pathlib.PurePosixPath(path).parts
              assert pathlib.Path(path).is_file() and not pathlib.Path(path).is_symlink()
              mode=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              assert mode in ['100644','100755']
              entries.append({'path':path,'mode':mode,'type':'blob','content':pathlib.Path(path).read_text()})
          result=api('/git/trees',{'base_tree':base_tree,'tree':entries})
          assert result['sha']==expected, result['sha']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'f009-source-objects';root.mkdir()
          (root/'source.json').write_text(json.dumps({'sourceParent':parent,'sourceTree':expected,'changedFiles':paths,'scope':'Source objects only; no branch update, merge, deployment or acceptance claim.'},indent=2)+'\n')
          print('Verified source tree:',expected)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f009-source-objects-${{ github.run_id }}
          path: ${{ runner.temp }}/f009-source-objects/
          if-no-files-found: error
          retention-days: 1
