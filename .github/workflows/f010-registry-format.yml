name: F010 registry formatter
on:
  push:
    branches: ['feat/F010-html-parity-harness']
    paths: ['.github/workflows/f010-registry-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Apply repository-pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier scripts/f010/reference-registry.mjs --write
          pnpm exec prettier scripts/f010/reference-registry.mjs --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/f010/reference-registry.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(F010): format debt-baseline registry guard"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
