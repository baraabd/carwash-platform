name: F009 runtime candidate diagnostic
on:
  push:
    branches: ['feat/F009-ci-security']
    paths:
      - '.github/workflows/f009-runtime-candidate.yml'
      - 'scripts/dev/service-template.mjs'
      - 'scripts/ci/tools.lock.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify pinned runtime digest and print generator snapshots
        shell: bash
        run: |
          set -euo pipefail
          image='gcr.io/distroless/base-nossl-debian13@sha256:8c563c1fb5e120606f0d85733049775faed6192e2bd2223ef283a5393eec22b9'
          docker pull "$image"
          docker image inspect "$image" --format 'ARCH={{.Architecture}} OS={{.Os}}'
          docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}'
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { renderServiceFiles } from './scripts/dev/service-template.mjs';
          for (const service of ['identity','catalog','communications']) {
            const serialized=[...renderServiceFiles(service)]
              .map(([file,contents]) => `${file}\0${contents}`)
              .join('\0');
            console.log(`SNAPSHOT_${service.toUpperCase()}=${createHash('sha256').update(serialized).digest('hex')}`);
          }
          JS
