name: C001 formatting diagnostic
on:
  push:
    branches: ['fix/C001-inventory-hardening']
    paths: ['.github/workflows/c001-format-diagnostic.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier tests/unit/c001-customer-behavior-manifest.test.mjs --write
          git diff -- tests/unit/c001-customer-behavior-manifest.test.mjs
