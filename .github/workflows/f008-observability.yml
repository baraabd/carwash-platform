name: F008 observability acceptance
on:
  push:
    branches: [main, develop, 'feat/F008-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f008-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observability:
    name: F008 redaction trace metrics and runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Pinned tools and frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          node scripts/verify-toolchain.mjs
          pnpm install --frozen-lockfile
      - name: Build and run focused observability acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f008"
          pnpm generate
          pnpm build
          pnpm typecheck
          pnpm format:check
          pnpm lint
          pnpm test:observability | tee "$RUNNER_TEMP/f008/observability.log"
          pnpm check:boundaries
          pnpm check:design-reference
          pnpm test:design-lock
          git diff --exit-code
      - name: Real HTTP PostgreSQL RabbitMQ trace path and foundation regressions
        run: pnpm acceptance:run
      - name: Source and actual tool provenance
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/f008"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/f008/source.json"
          import { execFileSync } from 'node:child_process';
          const call = (cmd, args) => { try { return execFileSync(cmd, args, { encoding: 'utf8' }).trim(); } catch { return 'unavailable'; } };
          console.log(JSON.stringify({ scope: 'F008', sourceSha: call('git', ['rev-parse', 'HEAD']), sourceTree: call('git', ['rev-parse', 'HEAD^{tree}']), sourceDirty: call('git', ['status', '--porcelain']) !== '', node: process.version, pnpm: call('pnpm', ['--version']), docker: call('docker', ['--version']), note: 'Provenance only; acceptance requires all required job and test results.' }, null, 2));
          NODE
      - name: Retain safe focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f008-observability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/f008/
            evidence/acceptance/
          if-no-files-found: error
          retention-days: 14
