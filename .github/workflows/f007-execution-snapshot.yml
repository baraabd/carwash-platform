name: F007 execution workspace

on:
  push:
    branches: ['chore/F007-execution-snapshot']
    paths: ['.github/workflows/f007-execution-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f46a9a747df364e2c1f66da7aa64179bf7917e0c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned workspace
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          node scripts/check-design-reference.mjs
      - name: Create source and dependency snapshots (no credentials or git config)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f007-snapshot/toolchain/bin"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/f007-snapshot/source.tar.gz"
          cp "$(command -v node)" "$RUNNER_TEMP/f007-snapshot/toolchain/bin/node"
          cp -a "$(dirname "$(dirname "$(command -v node)")")/lib/node_modules/corepack" "$RUNNER_TEMP/f007-snapshot/toolchain/corepack"
          find . -name node_modules -type d -prune -print0 > "$RUNNER_TEMP/node-modules.paths"
          tar --null -T "$RUNNER_TEMP/node-modules.paths" -czf "$RUNNER_TEMP/f007-snapshot/dependencies.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/f007-snapshot/SOURCE_SHA.txt"
          node --version > "$RUNNER_TEMP/f007-snapshot/NODE_VERSION.txt"
          pnpm --version > "$RUNNER_TEMP/f007-snapshot/PNPM_VERSION.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f007-execution-workspace
          path: ${{ runner.temp }}/f007-snapshot/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
