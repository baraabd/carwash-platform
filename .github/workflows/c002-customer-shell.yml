name: C002 customer state and feature-boundary acceptance
on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/customer-web/**'
      - 'scripts/c002/**'
      - 'tests/unit/c002-*.test.mjs'
      - 'design/reference/approved/washgo-payments-interactive.html'
      - 'docs/design/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/c002-customer-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c002-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  customer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Frozen install and design authority
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm check:design-reference
          node scripts/c001/customer-behavior-manifest.mjs
      - name: Static state and boundary acceptance
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm --filter @carwash/customer-web typecheck
          pnpm --filter @carwash/customer-web build
          node scripts/c002/check-feature-boundaries.mjs
          node --test --test-reporter=spec tests/unit/c001-customer-behavior-manifest.test.mjs tests/unit/c002-customer-shell.test.mjs tests/unit/c002-state-boundaries.test.mjs
      - name: Browser fixture and geometry acceptance
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm --filter @carwash/customer-web preview --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/c002-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          C002_ORIGIN=http://127.0.0.1:4174 node scripts/c002/browser-acceptance.mjs
