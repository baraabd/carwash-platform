name: C002 dependency resolution diagnostic
on:
  push:
    branches: ['feat/C002-customer-shell']
    paths: ['.github/workflows/c002-dependency-diagnostic.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve stable frontend versions
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          for package in react react-dom react-router-dom vite @vitejs/plugin-react @types/react @types/react-dom; do
            printf '%s=' "$package"
            pnpm view "$package" version
          done
