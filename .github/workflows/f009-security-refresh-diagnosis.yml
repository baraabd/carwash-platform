name: F009 security refresh diagnosis only
on:
  push:
    branches: ['work/F009-security-refresh-20260929']
permissions:
  contents: write
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 301e6dd1f862e7d80280d88784482311872d151b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: '11044257272'
          run-id: 36591908021
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/observed-scan
      - name: Print only previously redacted image findings
        run: |
          python3 <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'observed-scan'
          files=list(root.rglob('scan-catalog.json'))
          assert len(files)==1
          report=json.loads(files[0].read_text())
          print(json.dumps({'sourceSha':'301e6dd1f862e7d80280d88784482311872d151b','sourceRun':36591908021,'scope':'Diagnosis only, not acceptance','scan':report},indent=2))
          PY
      - name: Resolve Multer 2.4.0 with the repository package manager
        env:
          CI: 'false'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          node scripts/verify-toolchain.mjs
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const file='package.json';
          const p=JSON.parse(readFileSync(file,'utf8'));
          assert.equal(p.pnpm.overrides.multer,'>=2.3.0');
          assert.equal(p.pnpm.overrides['@nestjs/platform-express>multer'],'2.3.0');
          p.pnpm.overrides.multer='2.4.0';
          p.pnpm.overrides['@nestjs/platform-express>multer']='2.4.0';
          writeFileSync(file,JSON.stringify(p,null,2)+'\n');
          JS
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm exec prettier --check package.json pnpm-lock.yaml
          node scripts/verify-frozen-install.mjs
          git diff --check
          git diff --stat
          git diff -- package.json pnpm-lock.yaml
      - name: Inspect current maintained runtime candidate without changing its pin
        env:
          CI_TOOLS_DIR: ${{ runner.temp }}/f009-tools
        run: |
          set -euo pipefail
          node scripts/ci/install-tools.mjs trivy
          docker pull gcr.io/distroless/cc-debian13:nonroot
          docker inspect --format '{{json .RepoDigests}}' gcr.io/distroless/cc-debian13:nonroot
          "$CI_TOOLS_DIR/trivy" image --scanners vuln --format json --output "$RUNNER_TEMP/runtime-scan.json" --timeout 10m gcr.io/distroless/cc-debian13:nonroot
          python3 <<'PY'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime-scan.json').read_text())
          rows=[{'id':v['VulnerabilityID'],'package':v['PkgName'],'installed':v.get('InstalledVersion'),'fixed':v.get('FixedVersion'),'severity':v['Severity']} for r in report.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v['Severity'] in ['HIGH','CRITICAL','UNKNOWN']]
          print(json.dumps({'scope':'Runtime candidate diagnosis only','findings':rows},indent=2))
          PY
      - name: Prepare verified package and lockfile tree objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          parent='301e6dd1f862e7d80280d88784482311872d151b'
          base_tree='71381ac2198a77eedc11f4a322e8e76fce7c8b08'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==parent
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(paths)==['package.json','pnpm-lock.yaml'], paths
          subprocess.run(['git','add','--',*paths],check=True)
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          data={'base_tree':base_tree,'tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]}
          request=urllib.request.Request('https://api.github.com/repos/baraabd/carwash-platform/git/trees',data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==expected
          print(json.dumps({'sourceParent':parent,'sourceTree':expected,'changedFiles':paths,'scope':'Reviewed source objects only; no branch update, merge, deployment or acceptance claim.'},indent=2))
          PY
