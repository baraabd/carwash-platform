name: F009 exact-source evidence review only
on:
  push:
    branches: ['work/F009-security-refresh-20260929']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify source and event provenance before reading artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          expected='3d36ef2d5af542f9692708b90121050aebb22d41'
          for run_id,event in [(36594313043,'push'),(36594322265,'pull_request')]:
              request=urllib.request.Request('https://api.github.com/repos/baraabd/carwash-platform/actions/runs/'+str(run_id),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response: data=json.load(response)
              assert data['head_sha']==expected and data['event']==event
              assert data['run_attempt']==1
              print(json.dumps({'runId':run_id,'event':event,'sourceSha':data['head_sha'],'status':data['status'],'conclusion':data['conclusion'],'scope':'Read-only evidence inspection, not acceptance'}))
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: f009-*-36594313043-1
          run-id: 36594313043
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-evidence/push
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: f009-*-36594322265-1
          run-id: 36594322265
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-evidence/pr
      - name: Inspect structured records without raw logs, secrets or snippets
        run: |
          python3 <<'PY'
          import json, os, pathlib
          expected='3d36ef2d5af542f9692708b90121050aebb22d41'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'source-evidence'
          for event in ['push','pr']:
              files=sorted((root/event).rglob('*.json'))
              assert 0<len(files)<=100
              for file in files:
                  assert not file.is_symlink()
                  if file.stat().st_size>32768:
                      print(json.dumps({'event':event,'file':str(file.relative_to(root)),'omitted':'large inventory; not needed for this diagnosis'}))
                      continue
                  data=json.loads(file.read_text())
                  if isinstance(data,dict) and 'sourceSha' in data:
                      assert data['sourceSha']==expected
                  print(json.dumps({'event':event,'file':str(file.relative_to(root)),'record':data},ensure_ascii=True))
          PY
