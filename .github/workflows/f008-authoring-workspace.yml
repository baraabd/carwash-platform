name: F008 verified tree authoring
on:
  push:
    branches: ['work/F008-workspace-20260927']
permissions:
  contents: write
jobs:
  source-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 15544a92a270b2abafcf57e58191e90b7d8eba42
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify the tested source tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = os.environ['GH_REPOSITORY']
          assert repo == 'baraabd/carwash-platform'
          parent = '15544a92a270b2abafcf57e58191e90b7d8eba42'
          base_tree = 'da6397af65e6c5e7ae277e51caf408350611a4cf'
          expected_tree = '687389eabd7350fcc215b650ae9311e75e38fb1c'
          expected_digest = '067ab28f6c4c3df19bc7073d002acf2de525bb7e501af781e6f53a4472313104'
          blobs = ['ef312f2dbf0b63e7bb8a3847bfd52d759c2c67dc', '4a341ec9e9770fd0ab7b392221db3f25358fc84b', '602298a62bd7135e2b5592d4ec1050d2393e5d71', 'b72807b229db4e5f63abd3d41dfa9b725830b8c2', '0df0cb7ea89f37f689b793544a9d222ba3a10bbe', '67cb3a58c80d0f6af4723144d88208a7a79e8818']
          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          packed = b''.join(base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in blobs)
          assert len(packed) == 31956 and hashlib.sha256(packed).hexdigest() == expected_digest
          patch = lzma.decompress(packed, memlimit=268435456)
          assert len(patch) == 139173
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == parent
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          actual_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual_tree == expected_tree
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 66 and len(set(paths)) == 66
          frozen = json.loads(pathlib.Path('docs/design/reference-manifest.json').read_text())
          forbidden = set(frozen['frozenPolicyPaths']) | {item['path'] for item in frozen['artifacts']}
          for path in paths:
              assert path not in forbidden and not path.startswith(('design/', '.claude/', '.env'))
              assert '..' not in pathlib.PurePosixPath(path).parts
              assert pathlib.Path(path).is_file() and not pathlib.Path(path).is_symlink()
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(path).read_text()} for path in paths]
          result = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
          assert result['sha'] == expected_tree, result['sha']
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'f008-tree'
          evidence.mkdir()
          record = {'sourceParent': parent, 'sourceTree': result['sha'], 'patchSha256': expected_digest, 'changedFiles': paths, 'scope': 'Source authoring only. No branch update, merge, deployment or acceptance claim.'}
          (evidence / 'tree.json').write_text(json.dumps(record, indent=2) + '\n')
          print('VERIFIED_SOURCE_TREE=' + result['sha'])
          print('Changed files: ' + str(len(paths)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f008-source-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/f008-tree/
          retention-days: 1
          if-no-files-found: error
