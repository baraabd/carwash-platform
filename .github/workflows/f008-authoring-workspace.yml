name: F008 isolated dependency metadata
on:
  push:
    branches: ['work/F008-workspace-20260927']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve public packages and technical workspace links
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm --filter @carwash/observability add --save-exact pino@10.3.1 prom-client@15.1.3 @opentelemetry/api@1.9.1 @opentelemetry/core@2.11.0 @opentelemetry/context-async-hooks@2.11.0 @opentelemetry/resources@2.11.0 @opentelemetry/sdk-trace-base@2.11.0 @opentelemetry/exporter-trace-otlp-http@0.222.0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const directory of ['packages/service-kit', 'packages/platform-messaging', 'apps/api-gateway']) {
            const file = `${directory}/package.json`;
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            value.dependencies['@carwash/observability'] = 'workspace:*';
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          }
          NODE
          pnpm install --lockfile-only --force
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/f008-metadata"
          tar -czf "$RUNNER_TEMP/f008-metadata/metadata.tgz" -C "$HOME/.cache/pnpm" .
          cp pnpm-lock.yaml "$RUNNER_TEMP/f008-metadata/resolved-lock.yaml"
          printf 'Dependency authoring only, not acceptance.\nNode: %s\npnpm: %s\n' "$(node -v)" "$(pnpm -v)" > "$RUNNER_TEMP/f008-metadata/PROVENANCE.txt"
          cd "$RUNNER_TEMP/f008-metadata"
          sha256sum metadata.tgz resolved-lock.yaml > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f008-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/f008-metadata/
          retention-days: 1
          if-no-files-found: error
