# P07-E1 immutable release artifacts.
#
# Pull requests rehearse the full build/push/verify/pull-by-digest path against a
# loopback registry with no registry credential. Only a push to main (or a manual
# dispatch on main) publishes to GHCR with Sigstore-signed provenance.
name: P07 release artifacts
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer pull-request push supersedes a rehearsal; a main publication always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rehearse:
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/p07-release-build.yml
    with:
      publish: false
    # The rehearsal never receives a registry write or OIDC token.
    permissions:
      contents: read
      packages: read
  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/p07-release-build.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  gate:
    name: Release artifacts verified
    if: always()
    needs: [rehearse, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Require the selected artifact verification path
        env:
          REHEARSAL_RESULT: ${{ needs.rehearse.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node scripts/production/E/governance/release-workflow-gate.mjs
