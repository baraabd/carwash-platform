name: C002 temporary formatting
on:
  push:
    branches: ['feat/C002-customer-shell-final']
    paths: ['.github/workflows/c002-format-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Apply pinned Prettier to C002-owned files
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier \
            apps/customer-web/src/app/CustomerShell.tsx \
            apps/customer-web/src/app/Icon.tsx \
            apps/customer-web/src/app/router.tsx \
            apps/customer-web/src/app/ShellPlaceholder.tsx \
            apps/customer-web/src/styles/customer-shell.css \
            scripts/c002/browser-acceptance.mjs \
            tests/unit/c002-customer-shell.test.mjs \
            --write
          pnpm exec prettier \
            apps/customer-web/src/app/CustomerShell.tsx \
            apps/customer-web/src/app/Icon.tsx \
            apps/customer-web/src/app/router.tsx \
            apps/customer-web/src/app/ShellPlaceholder.tsx \
            apps/customer-web/src/styles/customer-shell.css \
            scripts/c002/browser-acceptance.mjs \
            tests/unit/c002-customer-shell.test.mjs \
            --check
          if git diff --quiet -- \
            apps/customer-web/src/app/CustomerShell.tsx \
            apps/customer-web/src/app/Icon.tsx \
            apps/customer-web/src/app/router.tsx \
            apps/customer-web/src/app/ShellPlaceholder.tsx \
            apps/customer-web/src/styles/customer-shell.css \
            scripts/c002/browser-acceptance.mjs \
            tests/unit/c002-customer-shell.test.mjs; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/customer-web/src/app/CustomerShell.tsx \
            apps/customer-web/src/app/Icon.tsx \
            apps/customer-web/src/app/router.tsx \
            apps/customer-web/src/app/ShellPlaceholder.tsx \
            apps/customer-web/src/styles/customer-shell.css \
            scripts/c002/browser-acceptance.mjs \
            tests/unit/c002-customer-shell.test.mjs
          git commit -m 'style(C002): apply project formatting'
          git push origin HEAD:feat/C002-customer-shell-final
