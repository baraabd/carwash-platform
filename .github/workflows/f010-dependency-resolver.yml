name: F010 dependency resolver
on:
  push:
    branches: ['feat/F010-html-parity-harness']
    paths: ['.github/workflows/f010-dependency-resolver.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve exact accessibility dependency
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm add -Dw --save-exact axe-core
          pnpm install --frozen-lockfile
          pnpm list axe-core --depth 0
          mkdir -p "$RUNNER_TEMP/f010-lock"
          cp package.json pnpm-lock.yaml "$RUNNER_TEMP/f010-lock/"
          printf 'source=%s\nnode=%s\npnpm=%s\n' "$(git rev-parse HEAD)" "$(node --version)" "$(pnpm --version)" > "$RUNNER_TEMP/f010-lock/PROVENANCE.txt"
          sha256sum package.json pnpm-lock.yaml > "$RUNNER_TEMP/f010-lock/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f010-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/f010-lock/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
