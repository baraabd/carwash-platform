name: C002 temporary lockfile resolution
on:
  push:
    branches: ['feat/C002-customer-shell-v2']
    paths: ['.github/workflows/c002-lockfile-resolution-temp.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve and commit genuine pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- apps/customer-web/package.json
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(C002): resolve customer web lockfile'
          git push origin HEAD:feat/C002-customer-shell-v2
