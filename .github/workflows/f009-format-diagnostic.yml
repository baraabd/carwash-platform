name: F009 formatting diagnostic
on:
  push:
    branches: ['feat/F009-ci-security']
    paths: ['.github/workflows/f009-format-diagnostic.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier scripts/ci/image.mjs tests/unit/f009-security-remediation.test.mjs --write
          git diff -- scripts/ci/image.mjs tests/unit/f009-security-remediation.test.mjs
