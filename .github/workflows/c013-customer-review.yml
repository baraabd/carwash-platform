name: C013 customer booking review parity acceptance
# The C002-C012 browser suites run in the C012 workflow, which triggers on every
# apps/customer-web/** change; this workflow adds the Review suite and its units.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/customer-web/**'
      - 'scripts/c004/**'
      - 'scripts/c011/**'
      - 'scripts/c013/**'
      - 'scripts/f010/**'
      - 'tests/unit/c006-*.test.mjs'
      - 'tests/unit/c008-*.test.mjs'
      - 'tests/unit/c010-*.test.mjs'
      - 'tests/unit/c011-*.test.mjs'
      - 'tests/unit/c012-*.test.mjs'
      - 'tests/unit/c013-*.test.mjs'
      - 'design/reference/approved/washgo-payments-interactive.html'
      - 'docs/design/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/c013-customer-review.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/customer-web/**'
      - 'scripts/c004/**'
      - 'scripts/c011/**'
      - 'scripts/c013/**'
      - 'tests/unit/c013-*.test.mjs'
      - '.github/workflows/c013-customer-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c013-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  customer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Frozen install and design authority
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm check:design-reference
          pnpm check:f010-references
          node scripts/c001/customer-behavior-manifest.mjs
      - name: Static, boundary and unit acceptance
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm --filter @carwash/customer-web typecheck
          pnpm --filter @carwash/customer-web build
          node scripts/c002/check-feature-boundaries.mjs
          node --test --test-reporter=spec \
            tests/unit/c001-customer-behavior-manifest.test.mjs \
            tests/unit/c002-customer-shell.test.mjs \
            tests/unit/c002-state-boundaries.test.mjs \
            tests/unit/c003-customer-home.test.mjs \
            tests/unit/c004-customer-vehicle.test.mjs \
            tests/unit/c005-customer-garage.test.mjs \
            tests/unit/c006-customer-care-packages.test.mjs \
            tests/unit/c007-customer-extras.test.mjs \
            tests/unit/c008-customer-location.test.mjs \
            tests/unit/c009-customer-saved-addresses.test.mjs \
            tests/unit/c010-customer-scheduling.test.mjs \
            tests/unit/c011-customer-contact.test.mjs \
            tests/unit/c012-customer-payment-method.test.mjs \
            tests/unit/c013-customer-review.test.mjs \
            tests/unit/f008-recovery-scope.test.mjs
      - name: Review browser parity against the approved reference
        shell: bash
        env:
          C013_ORIGIN: http://127.0.0.1:4174
          C013_EVIDENCE_DIR: ${{ runner.temp }}/c013-evidence
          C013_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm --filter @carwash/customer-web preview --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/c013-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          node scripts/c013/browser-acceptance.mjs
      - name: Upload reference/candidate/diff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c013-booking-review-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c013-evidence
          if-no-files-found: error
          retention-days: 14
