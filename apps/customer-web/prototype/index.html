  async function proofSheet(){const o=activeOrder();if(!o||o.stage===-1||!['awaiting_transfer','awaiting_review','needs_review'].includes(o.payment?.status))return;const p=o.payment;showSheet('أرسلت التحويل؟ نراجع التفاصيل.',`<p class="sheet-intro">أضف رقم العملية <strong>أو</strong> صورة الإيصال. هذه البيانات ليست تأكيد دفع، ولا نطلب رمز التحقق أو كلمة المرور.</p><div class="pay-demo-note">هذه تجربة فقط. استخدم الزر التالي بدل إدخال بيانات مالية حقيقية.</div><button class="btn secondary full" data-action="pay-proof-demo">${I('spark','sm')}ملء إثبات تجريبي</button><form id="pay-proof-form" novalidate><label class="field gap-top"><span class="field-label">رقم العملية <small>أو أرفق صورة</small></span><input class="input ltr" id="pay-reference" name="reference" maxlength="64" autocomplete="off" value="${esc(p.refDraft||p.reference)}" placeholder="رقم العملية من إيصال المحفظة" aria-describedby="pay-reference-help pay-proof-error"></label><p class="input-note" id="pay-reference-help">ليس كلمة مرور أو رقمًا سريًا. 4–64 حرفًا أو رقمًا.</p><label class="pay-upload">${I('receipt-pay')}<span class="grow"><strong>${p.hasReceipt?'استبدال صورة الإثبات':'أرفق صورة إثبات'}</strong><small>JPEG / PNG / WebP · معالجة وحفظ محلي</small></span><input class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" id="pay-proof-image" data-pay-proof="${esc(o.id)}"></label><div id="pay-proof-preview"></div><p class="input-note" id="pay-proof-image-status" role="status"></p><p class="error" id="pay-proof-error" role="alert"></p><p class="pay-proof-note">احجب رصيد المحفظة والمعاملات الأخرى وأرقام الهوية. سيبقى الطلب قيد المراجعة حتى المطابقة. الصورة وحدها لا تثبت وصول المال.</p><button class="btn full" type="submit" id="pay-proof-submit">إرسال للمراجعة التجريبية ${I('arrow','sm')}</button></form>`,'pay-proof');
    if(p.hasReceipt){const data=await Media.get(o.payment.intent,'payment','receipt');if(sheetMode!=='pay-proof'||activeOrder()?.id!==o.id)return;if(data){$('#pay-proof-preview').innerHTML=`<img class="proof-preview" src="${data}" alt="صورة إثبات محفوظة محليًا"><button class="text-btn danger" data-action="pay-remove-proof">حذف صورة الإثبات</button>`;$('#pay-proof-image-status').textContent='صورة محفوظة محليًا. لا يتم رفعها إلى أي جهة.';}else{$('#pay-proof-image-status').textContent='الصورة غير متاحة في هذا المتصفح؛ أرفقها مجددًا أو أدخل رقم العملية.';p.hasReceipt=false;save();}}}
  async function handlePayProofImage(el){const o=activeOrder(),file=el.files?.[0];if(!o||el.dataset.payProof!==o.id||!file||payProofBusy)return;const intent=o.payment.intent;if(!['awaiting_transfer','awaiting_review','needs_review'].includes(o.payment.status)||o.stage===-1)return;payProofBusy=true;$('#pay-proof-submit')?.setAttribute('disabled','');$('#pay-proof-image-status').textContent='جارٍ تجهيز الصورة محليًا…';try{const data=await compressedPhoto(file);if(o.payment.intent!==intent||o.stage===-1)return;await Media.put(intent,'payment','receipt',data);if(o.payment.intent!==intent||o.stage===-1)return;o.payment.hasReceipt=true;save();if(sheetMode==='pay-proof'&&activeOrder()?.id===o.id){$('#pay-proof-preview').innerHTML=`<img class="proof-preview" src="${data}" alt="إثبات تجريبي اخترته من جهازك"><button class="text-btn danger" data-action="pay-remove-proof">حذف الصورة</button>`;$('#pay-proof-image-status').textContent=photoStorageOK?'جاهزة. محفوظة محليًا دون إرسال.':'جاهزة لهذه الجلسة فقط؛ التخزين الدائم غير متاح.';$('#pay-proof-error').textContent='';}}catch(err){if($('#pay-proof-image-status'))$('#pay-proof-image-status').textContent=err.message||'تعذّر تجهيز الصورة.';}finally{payProofBusy=false;$('#pay-proof-submit')?.removeAttribute('disabled');el.value='';}}
  async function submitProof(e){e.preventDefault();const o=activeOrder();if(!o||payBusy||payProofBusy||o.stage===-1||!['awaiting_transfer','awaiting_review','needs_review'].includes(o.payment.status))return;const p=o.payment,ref=digits(str(new FormData(e.target).get('reference'),64));if(ref&&!/^[A-Za-z0-9\u0621-\u064A _-]{4,64}$/.test(ref)){$('#pay-proof-error').textContent='أدخل رقم عملية صحيحًا من 4–64 حرفًا أو رقمًا، أو اتركه فارغًا وأرفق صورة.';$('#pay-reference').setAttribute('aria-invalid','true');$('#pay-reference').focus();return;}if(!ref&&!p.hasReceipt){$('#pay-proof-error').textContent='أضف رقم العملية أو صورة إثبات للمراجعة.';$('#pay-reference').setAttribute('aria-invalid','true');$('#pay-reference').focus();return;}payBusy=true;$('#pay-proof-submit').disabled=true;try{if(!ref&&p.hasReceipt&&!await Media.get(o.payment.intent,'payment','receipt')){p.hasReceipt=false;$('#pay-proof-error').textContent='الصورة لم تعد متاحة. أرفقها مجددًا أو أدخل رقم العملية.';save();return;}p.reference=ref;p.refDraft=ref;p.status='awaiting_review';p.submittedAt=new Date().toISOString();p.events.push({type:'proof_submitted_demo',at:p.submittedAt});save();closeSheet();go('payment');toast(storageOK?'طلب المراجعة محفوظ. لم يتم تأكيد وصول مبلغ.':'طلب المراجعة محفوظ لهذه الجلسة فقط. لم يُؤكد الدفع.');}finally{payBusy=false;$('#pay-proof-submit')?.removeAttribute('disabled');}}
  function simulatePayment(result){const o=activeOrder();if(!o||o.stage===-1||o.payment.method==='cash'||!['awaiting_review','needs_review'].includes(o.payment.status)||!['paid_demo','needs_review'].includes(result))return;const p=o.payment;if(result==='paid_demo'&&p.reference&&S.orders.some(x=>x.id!==o.id&&x.payment?.method===p.method&&x.payment?.reference===p.reference&&['paid_demo','refund_review_demo'].includes(x.payment?.status))){p.status='needs_review';save();render({scroll:true,focus:true});toast('رقم العملية مستخدم في طلب آخر. أوقفنا التأكيد للمراجعة.');return;}if(p.amount!==o.total||p.currency!=='SYP'){p.status='needs_review';save();render();toast('مبلغ الطلب والدفعة غير متطابقين. أوقفنا التأكيد.');return;}p.status=result;p.verifiedAt=result==='paid_demo'?new Date().toISOString():null;p.events.push({type:`${result}_by_demo_control`,at:new Date().toISOString()});save();render({scroll:true,focus:true,animate:true});toast(result==='paid_demo'?'محاكاة فقط: طابقت الواجهة التحويل، دون اتصال مالي.':'محاكاة: العملية تحتاج مراجعة. لا تعِد الدفع.');}
  function paymentChangeSheet(){const o=activeOrder();if(!o||o.stage!==0||!['cash_due','awaiting_transfer'].includes(o.payment.status))return;showSheet('تغيير الطريقة، دون دفع مرتين.',`<p class="sheet-intro">تابع فقط إذا <strong>لم تُجرِ أي تحويل</strong>. إذا حولت فعلًا، احتفظ بالطريقة الحالية وأرسل رقم العملية للمراجعة.</p>${Object.entries(PAYMENT_METHODS).filter(([k])=>k!==o.payment.method).map(([key,m])=>`<button class="pay-change-option" data-action="pay-change-confirm" data-method="${key}">${payLogo(key)}<span><strong>${m.name}</strong><small>لم أحوّل مالًا · استخدم هذه الطريقة</small></span></button>`).join('')}<button class="btn secondary full gap-top" data-action="close-sheet">الاحتفاظ بالطريقة الحالية</button>`,'pay-change');}
  function changePayment(method){const o=activeOrder();if(!o||o.stage!==0||!Object.hasOwn(PAYMENT_METHODS,method)||!['cash_due','awaiting_transfer'].includes(o.payment.status))return;const previous=o.payment;previous.priorAttempts.push({method:previous.method,intent:previous.intent,status:'cancelled_before_transfer',at:new Date().toISOString()});o.paymentMethod=method;o.payment=createPayment(o);o.payment.priorAttempts=previous.priorAttempts;save();closeSheet();render({scroll:true,focus:true,animate:true});toast('تم تغيير الطريقة قبل التحويل. إجمالي الحجز لم يتغير.');}
  function payHelp(){showSheet('دفع واضح، بدون تخمين.',`<div class="pay-demo-note"><strong>هذا الملف لا يستقبل المال ولا يقرأ المحفظة.</strong> لا تُجرِ تحويلًا حقيقيًا أثناء التجربة.</div><div class="stack"><div class="info-note">${I('qr-pay')}رمز QR يحدد بيانات الدفع فقط؛ عرضه أو مسحه ليس إثباتًا لاستلام المال.</div><div class="info-note">${I('phone-pay')}على الهاتف نفسه يمكنك حفظ الصورة، أو نسخ بيانات المستفيد. استيراد QR من الصور يعتمد على دعم تطبيق المحفظة.</div><div class="info-note">${I('lock')}لا تدخل كلمة مرور أو رمز OTP. في التشغيل الفعلي نتحقق من المصدر المعتمد أو مراجعة حساب التاجر قبل اعتماد الدفع.</div></div><p class="pay-proof-note">إن علقت العملية: لا تدفع مرة أخرى ولا تغيّر وسيلة الدفع بعد التحويل. احتفظ برقم العملية واطلب المطابقة.</p><button class="btn full" data-action="close-sheet">العودة إلى تجربتي</button>`,'pay-help');}
  function paySettingsSheet(){showSheet('إعدادات QR · للمصمم فقط',`<p class="sheet-intro">أضف صورة رمز حساب التاجر لكل محفظة بصورة مستقلة. هذا إعداد محلي للمعاينة وليس ربطًا ماليًا أو لوحة إدارة موثّقة.</p><div class="pay-demo-note">لم يُقدَّم رمز تاجر حقيقي. الرموز الافتراضية تحتوي نصًا تجريبيًا فقط. لا نولّد QR رسميًا من رقم الهاتف ولا نفترض رابط دفع أو API.</div>${['sham','syriatel'].map(method=>{const cfg=payConfig[method];return`<section class="pay-settings-provider"><div class="row">${payLogo(method)}<h3>${PAYMENT_METHODS[method].name}</h3></div><form class="pay-config-form" data-method="${method}" novalidate><label class="field gap-top"><span class="field-label">اسم المستفيد الظاهر في المحفظة</span><input class="input" name="recipient" maxlength="80" value="${esc(cfg.recipient)}" autocomplete="off"></label><label class="field"><span class="field-label">رقم/معرّف حساب التاجر</span><input class="input ltr" name="account" maxlength="70" value="${esc(cfg.account)}" autocomplete="off"></label><label class="pay-upload">${I('qr-pay')}<span><strong>اختيار صورة QR ${cfg.custom?'بديلة':'من الجهاز'}</strong><small>PNG / JPEG / WebP · حتى 1 ميغابايت</small></span><input class="sr-only" type="file" name="qr" accept="image/png,image/jpeg,image/webp"></label><p class="input-note" data-config-file="${method}" role="status">${cfg.custom?'صورة محلية مضافة، لم تتحقق منها المنصة.':'يُستخدم الرمز التجريبي الآمن.'}</p><p class="error" data-config-error="${method}" role="alert"></p><button class="btn secondary full" type="submit">حفظ ${PAYMENT_METHODS[method].name}</button><button class="text-btn" type="button" data-action="pay-config-reset" data-method="${method}">استعادة الرمز التجريبي</button></form></section>`;}).join('')}<p class="pay-proof-note">الطلبات القائمة تحتفظ ببيانات مستفيدها ورمزها. تغييرات الإعداد تطبق على الدفعات الجديدة فقط. لا تُضف أسرار API أو كلمات مرور هنا.</p>`,'pay-settings');}
  async function originalQRFile(file){if(!file||file.size>1024*1024)throw new Error('اختر صورة QR لا تتجاوز 1 ميغابايت.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('اختر صورة PNG أو JPEG أو WebP فقط، لا ملف SVG.');const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('تعذّر قراءة الصورة.'));r.readAsDataURL(file);});if(!validDataURL(data))throw new Error('تعذّر قراءة محتوى الصورة.');const im=new Image();im.src=data;await im.decode();if(!im.width||im.width*im.height>16000000)throw new Error('صورة الرمز كبيرة جدًا. اختر نسخة أصغر.');return data;}
  async function submitPayConfig(e){e.preventDefault();if(payConfigBusy)return;const method=e.target.dataset.method;if(!['sham','syriatel'].includes(method))return;const f=new FormData(e.target),recipient=str(f.get('recipient'),80),account=str(f.get('account'),70),error=$(`[data-config-error="${method}"]`);if(recipient.length<2||account.length<3){error.textContent='أدخل اسم المستفيد ومعرّف الحساب كاملين.';return;}const file=e.target.querySelector('[name="qr"]').files?.[0];const previous=payConfig[method];if(!file&&previous.qrKey.startsWith('demo:')&&(recipient!==defaultMerchant(method).recipient||account!==defaultMerchant(method).account)){error.textContent='أرفق QR الخاص بالحساب الجديد. لا يمكن ربط بيانات حقيقية برمز تجريبي.';return;}if(!file&&previous.custom&&(recipient!==previous.recipient||account!==previous.account)){error.textContent='عند تغيير المستفيد، أرفق رمزه المطابق مجددًا لمنع تعارض الحساب والرمز.';return;}payConfigBusy=true;const submit=e.target.querySelector('[type="submit"]');submit.disabled=true;try{let qrKey=previous.qrKey;if(file){const data=await originalQRFile(file);qrKey=uid('QR');await Media.put(qrKey,'wallet','qr',data);}payConfig[method]={recipient,account,qrKey,custom:!qrKey.startsWith('demo:')};const persistent=savePayConfig();error.textContent='';$(`[data-config-file="${method}"]`).textContent=`تم الحفظ ${persistent&&photoStorageOK?'محليًا':'لهذه الجلسة'}؛ الصورة غير متحقق منها. تطبق على طلب جديد.`;toast('تم حفظ إعداد المحفظة للمعاينة فقط.');}catch(err){error.textContent=err.message||'تعذّر حفظ إعداد QR.';}finally{payConfigBusy=false;if(submit.isConnected)submit.disabled=false;}}
  function paymentDemoStart(){const d=blank(),slot=earliest();Object.assign(d,sampleAddress('home'),slot||{},{name:'سامر التجريبي',phone:'0900000000',plate:'123456',carName:'سيارتي التجريبية',service:'complete',touched:true});S.draft=d;quickMode=false;go('booking',5);toast('بيانات تجريبية جاهزة. اختر الدفع ثم راجع الحجز.');}
  function exportPay(){const o=activeOrder();if(!o?.payment)return;const p=o.payment;downloadFile(`WashGo-${o.id}-PAYMENT-DEMO.txt`,['WashGo — ملخص محاكاة فقط. ليس إيصال دفع أو فاتورة.',`الطلب: ${o.id}`,`الطريقة: ${PAYMENT_METHODS[p.method].name}`,`الحالة: ${payState(o).label}`,`المبلغ التجريبي: ${p.amount} SYP`,`رقم العملية المدخل: ${p.reference||'غير مدخل'}`,'لم يتم الاتصال بأي محفظة أو تحصيل أو استرداد أي مبلغ.'].join('\n'));toast('تم تجهيز ملخص التجربة دون صور أو بيانات حساب المستفيد.');}
  function cancelPaymentForOrder(o){if(!o?.payment)return;const p=o.payment;p.status=['paid_demo','cash_collected_demo','awaiting_review','needs_review'].includes(p.status)?'refund_review_demo':'cancelled';p.events.push({type:'booking_cancelled_demo',at:new Date().toISOString()});}
  function payEventListeners(){
    document.addEventListener('change',e=>{const el=e.target;if(!(el instanceof HTMLInputElement))return;if(el.name==='paymentMethod'&&Object.hasOwn(PAYMENT_METHODS,el.value)){S.draft.paymentMethod=el.value;delete errors.paymentMethod;animateSelection(`[data-pay-option="${el.value}"]`);touch();render({focusSelector:`input[name="paymentMethod"][value="${el.value}"]`});$('#announcer').textContent=`${PAYMENT_METHODS[el.value].name}. الإجمالي ${cost(S.draft).total} ليرة سورية تجريبية.`;}else if(el.dataset.payProof)handlePayProofImage(el);else if(el.name==='qr'&&el.form?.classList.contains('pay-config-form')){const name=el.files?.[0]?.name||'لم تُختر صورة';const node=$(`[data-config-file="${el.form.dataset.method}"]`);if(node)node.textContent=name;}});
    document.addEventListener('input',e=>{if(e.target.id==='pay-reference'){const o=activeOrder();if(!o)return;o.payment.refDraft=e.target.value.slice(0,64);save();e.target.removeAttribute('aria-invalid');if($('#pay-proof-error'))$('#pay-proof-error').textContent='';}});
    document.addEventListener('submit',e=>{if(e.target.id==='pay-proof-form')submitProof(e);else if(e.target.classList.contains('pay-config-form'))submitPayConfig(e);});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(!a.startsWith('pay-'))return;
      if(a==='pay-demo')paymentDemoStart();
      else if(a==='pay-settings')paySettingsSheet();
      else if(a==='pay-open'){if(S.orders.some(o=>o.id===b.dataset.id)){S.activeOrderId=b.dataset.id;go('payment');}}
      else if(a==='pay-to-order')go('tracking');
      else if(a==='pay-help')payHelp();
      else if(a==='pay-copy')await copyPay(b.dataset.copy);
      else if(a==='pay-save-qr')await saveQR();
      else if(a==='pay-expand')await expandPaymentQR();
      else if(a==='pay-proof')await proofSheet();
      else if(a==='pay-proof-demo'){const o=activeOrder();if(o&&$('#pay-reference')){o.payment.refDraft=`DEMO-${o.payment.intent.slice(-9)}`;$('#pay-reference').value=o.payment.refDraft;$('#pay-proof-error').textContent='';save();toast('رقم عملية توضيحي فقط. لم يحدث أي تحويل.');}}
      else if(a==='pay-simulate')simulatePayment(b.dataset.result);
      else if(a==='pay-change')paymentChangeSheet();
      else if(a==='pay-change-confirm')changePayment(b.dataset.method);
      else if(a==='pay-export')exportPay();
      else if(a==='pay-remove-proof'){const o=activeOrder();if(!o||payProofBusy)return;await Media.remove(o.payment.intent,'payment','receipt');o.payment.hasReceipt=false;save();await proofSheet();toast('حُذفت صورة الإثبات. حالة الدفع لم تتغير.');}
      else if(a==='pay-config-reset'){const method=b.dataset.method;if(['sham','syriatel'].includes(method)&&!payConfigBusy){payConfig[method]=defaultMerchant(method);savePayConfig();paySettingsSheet();toast('أُعيد الرمز التجريبي للدفعات الجديدة فقط.');}}
      else if(a==='pay-cash-collected'){const o=activeOrder();if(o?.stage===4&&o.payment?.status==='cash_due'){o.payment.status='cash_collected_demo';o.payment.verifiedAt=new Date().toISOString();o.payment.events.push({type:'cash_collected_demo',at:o.payment.verifiedAt});save();render({scroll:true,focus:true,animate:true});toast('تمت محاكاة استلام الكاش، لا تحصيل حقيقي.');}}
    });
  }

  function vehicleView(){const d=S.draft;return`${heading('01 / سيارتك أولًا','أي سيارة ندلّل اليوم؟','اختر الحجم. تفاصيلها نضيفها مرة واحدة.')}${S.cars.length?`<div class="saved-car-chips chips" aria-label="سيارات محفوظة">${S.cars.map(c=>`<button class="chip ${d.carId===c.id?'selected':''}" data-action="choose-car" data-id="${esc(c.id)}">${I('car')}${esc(c.name)}</button>`).join('')}<button class="chip" data-action="fresh-car">${I('plus')}أخرى</button></div>`:''}<div class="vehicle-stage" id="vehicle-stage"><div class="stage-top"><span>YOUR CAR / YOUR CARE</span><span>${I('spark','sm')}</span></div><div class="stage-orbit"></div>${car(d.type)}<div class="stage-caption"><div><strong id="stage-name">${esc(carName())}</strong><small>الحجم يحدد وقت العناية وسعرها</small></div><span class="plate-mini" id="stage-plate" dir="auto" ${d.plate?'':'hidden'}>${esc(d.plate)}</span></div></div><div class="signature-car-grid" role="radiogroup" aria-label="اختر حجم السيارة">${Object.entries(V).map(([k,v])=>`<label class="signature-car ${d.type===k?'selected':''}"><input class="choice" type="radio" name="vehicleType" value="${k}" ${d.type===k?'checked':''}><span class="radio-circle">${d.type===k?I('check','sm'):''}</span>${car(k)}<span class="car-label"><strong>${v.name}</strong><small>${v.fee?`+${v.fee} ل.س`:'السعر الأساسي'}</small></span></label>`).join('')}</div><label class="field plate-field"><span class="field-label">لوحة السيارة<small>اختيارية في النموذج</small></span><span class="input-icon-wrap">${I('car')}<input class="input plate-input" id="plate" data-field="plate" type="text" maxlength="20" dir="auto" autocomplete="off" placeholder="مثال: 1234 أ ب ج" value="${esc(d.plate)}" aria-invalid="${!!errors.plate}" aria-describedby="plate-help${errors.plate?' error-plate':''}"></span><span class="input-note" id="plate-help">تساعد الفني على تمييز سيارتك. استخدم لوحة تجريبية.</span>${fieldError('plate')}</label><button class="disclosure-row car-more" data-action="vehicle-sheet"><span class="soft-icon">${I('edit')}</span><span class="grow"><strong>اسم السيارة ولونها</strong><p>${d.carName||d.color?`${esc(d.carName)} ${esc(d.color)}`:'تفاصيل اختيارية · لا حاجة لإعادتها لاحقًا'}</p></span>${I('left','sm')}</button><label class="checkbox-row save-car-check"><input type="checkbox" name="saveVehicleInline" ${d.saveVehicle?'checked':''}>احفظ السيارة على جهازي للحجز القادم.</label>`;}

  function serviceView(){const d=S.draft;return`${heading('02 / عناية على ذوقك','كيف تحبّ لمعتها؟','ثلاث باقات واضحة. اختر ما تحتاجه فقط.')}<div class="choice-context">${I('car','sm')}<span>${esc(carName())}</span><span class="context-dot"></span><span>الأسعار تشمل حجم سيارتك</span><button class="text-btn" data-action="book-step" data-step="0">تغيير</button></div><div class="service-list signature-services" role="radiogroup" aria-label="باقة الغسيل">${Object.entries(PACKAGES).map(([k,p],i)=>`<label class="service-option ${d.service===k?'selected':''}" style="--item:${i}"><input class="choice" type="radio" name="service" value="${k}" ${d.service===k?'checked':''}><div class="service-line"><span class="service-emblem emblem-${k}">${I(p.icon)}</span><span class="grow"><span class="service-kicker">${['EVERYDAY CLEAN','INSIDE & OUT','SIGNATURE CARE'][i]}</span><h3>${p.name}</h3><p>${I('clock')} ${p.minutes+V[d.type].minutes} دقيقة · ${p.short}</p></span><span class="service-side"><span class="radio-circle">${d.service===k?I('check','sm'):''}</span><strong class="service-amount">${p.price+V[d.type].fee}<small>ل.س</small></strong></span></div><div class="service-features">${p.features.map(f=>`<span>${I('check')}${f}</span>`).join('')}</div></label>`).join('')}</div><button class="disclosure-row gap-top" data-action="extras-sheet"><span class="soft-icon">${I('plus')}</span><span class="grow"><strong>لمسة إضافية؟</strong><p>${d.extras.length?d.extras.map(k=>EXTRAS[k].name).join('، '):'المقاعد، الإطارات أو التعطير · اختياري'}</p></span><span class="amount">${d.extras.length?`+${cost(d).extras} ل.س`:''}</span>${I('left','sm')}</button>`;}
  function field(key,label,placeholder,optional=false,type='text'){return`<label class="field"><span class="field-label">${label}<small>${optional?'اختياري':'مطلوب'}</small></span><input class="input ${type==='tel'?'ltr':''}" id="${key}" data-field="${key}" type="${type}" ${type==='tel'?'inputmode="tel"':''} autocomplete="off" maxlength="${key==='phone'?24:key==='name'?60:160}" placeholder="${placeholder}" value="${esc(S.draft[key])}" aria-invalid="${!!errors[key]}" ${errors[key]?`aria-describedby="error-${key}"`:''}>${fieldError(key)}</label>`;}
  function fieldError(key){return errors[key]?`<p class="error" id="error-${key}" role="alert">${esc(errors[key])}</p>`:'';}
  function locationView(){const d=S.draft;return`${heading('03 / أنت تختار المكان','أين نأتي لسيارتك؟','في البيت أو العمل. اللمعة تصلك.')}${S.addresses.length?`<div class="chips address-chips">${S.addresses.map(a=>`<button class="chip ${d.address===a.address?'selected':''}" data-action="saved-address" data-id="${esc(a.id)}">${I('pin')}${esc(a.label)}</button>`).join('')}</div>`:''}<button class="location-card full location-picker" data-action="address-sheet" aria-label="${d.address?'تعديل':'تحديد'} مكان غسيل السيارة"><div class="mini-map signature-map">${mapSVG()}<span class="map-radius"></span><span class="mini-map-pin">${I('pin')}</span><span class="map-mini-note">خريطة توضيحية</span><span class="map-open-icon">${I('expand')}</span></div><span class="disclosure-row"><span class="soft-icon">${I(d.address?'check':'pin')}</span><span class="grow"><strong>${d.address?esc(d.addressLabel||'موقع الغسيل'):'حدد مكان السيارة'}</strong><span class="address-preview">${d.address?esc(d.address):'اكتب العنوان أو اختر نقطة على الخريطة'}</span></span>${I('left','sm')}</span></button>${fieldError('address')}<div class="mini-title">للتجربة السريعة <small>عناوين توضيحية فقط</small></div><div class="location-shortcuts">${[['home','home','المنزل'],['work','work','العمل']].map(([kind,icon,name])=>`<button class="place-shortcut ${d.place?.kind===kind?'selected':''}" data-action="sample-address" data-kind="${kind}"><span class="chapter-icon">${I(icon)}</span><span><strong>${name}</strong><small>عنوان تجريبي</small></span>${d.place?.kind===kind?I('check','sm'):I('plus','sm')}</button>`).join('')}</div><div class="info-note location-tip">${I('info')}<span>لتسهيل الوصول، أضف الشارع ومكان الوقوف. يمكنك كتابة العنوان دون السماح بتحديد موقعك.</span></div>${d.locationNote?`<div class="selection-summary">${I('message')} ${esc(d.locationNote)}</div>`:''}`;}
  function scheduleView(){const d=S.draft,ds=dates(),first=earliest(),slots=TIMES.filter(t=>available(d.date,t));return`${heading('04 / وقتك له الأولوية','متى يناسبك نجي؟','اختر وقت الوصول. المواعيد هنا للتجربة فقط.')}<div class="choice-context">${I('pin','sm')}<span class="grow">${esc(d.addressLabel||'موقع الغسيل')}</span><button class="text-btn" data-action="book-step" data-step="2">تغيير</button></div><button class="earliest signature-earliest" data-action="earliest" aria-pressed="${!!d.time&&first?.time===d.time&&first?.date===d.date}"><span class="chapter-icon">${I('bolt')}</span><span class="grow"><strong>أقرب موعد متاح</strong><p>${first?`${dateLabel(first.date)} · ${timeLabel(first.time)}`:'لا يوجد موعد متاح'}</p></span>${d.time&&first?.time===d.time&&first?.date===d.date?I('check'):I('left','sm')}</button><div class="mini-title">أو اختر يومًا يناسبك <small>توقيت دمشق</small></div><div class="dates" aria-label="اختر اليوم">${ds.map(x=>`<button class="date ${d.date===x.key?'selected':''}" data-action="day" data-day="${x.key}" aria-label="${dateLabel(x.key)}" aria-pressed="${d.date===x.key}"><small>${x.label}</small><strong>${x.day}</strong><span>${x.month}</span></button>`).join('')}</div><div class="mini-title">وقت الوصول <small>مدة العناية ${cost(d).minutes} دقيقة</small></div><div class="times" role="group" aria-label="الأوقات المتاحة">${(showAllTimes||slots.indexOf(d.time)>5?slots:slots.slice(0,6)).map(t=>`<button class="time ${d.time===t?'selected':''}" data-action="time" data-time="${t}" aria-pressed="${d.time===t}">${timeLabel(t)}${d.time===t?I('check','sm'):''}</button>`).join('')}</div>${!slots.length?'<p class="info-note">لا يوجد وقت متبقٍ لهذا اليوم. اختر يومًا آخر أو أقرب موعد.</p>':slots.length>6?`<div class="center"><button class="text-btn" data-action="all-times">${showAllTimes?'عرض أوقات أقل':'عرض كل الأوقات'} ${I(showAllTimes?'up':'down','sm')}</button></div>`:''}${fieldError('time')}<div class="selection-summary ${d.time?'has-value':''}" aria-live="polite">${I(d.time?'check':'clock')}<span>${d.time?`${dateLabel(d.date)} · ${timeLabel(d.time)}`:'اختر الوقت، ثم نكمل بيانات التواصل.'}</span></div>`;}
  function contactView(){return`${heading('05 / نتعرّف عليك','بأي اسم نستقبلك؟','بيانات بسيطة، دون كلمة مرور أو إنشاء حساب.')}${field('name','الاسم','مثال: سامر')}${field('phone','رقم التواصل','09XX XXX XXX',false,'tel')}<div class="row between"><p class="input-note">استخدم بيانات تجريبية، لا تُرسل رسالة تحقق.</p><button class="text-btn" data-action="demo-contact">ملء تجريبي</button></div><details class="optional-details"><summary>ملاحظة للفني <span class="tiny muted">اختياري</span></summary><label class="sr-only" for="note">ملاحظة للفني</label><textarea class="input" id="note" data-field="note" maxlength="300" rows="2" placeholder="مثال: السيارة بجانب المدخل الخلفي">${esc(S.draft.note)}</textarea></details><div class="info-note">${I('lock')}<span>يُحفظ الحجز في هذا المتصفح فقط. لا تدخل أرقام بطاقات أو بيانات حساسة.</span></div>`;}
  function summary(d,editable=true){return`<div class="receipt"><div class="receipt-top">${car(d.type)}<div class="grow"><h3>${PACKAGES[d.service].name}</h3><p>${esc(carName(d))}${d.color?` · ${esc(d.color)}`:''}</p>${d.plate?plateMarkup(d.plate):'<small class="tiny muted">بدون لوحة في هذا النموذج</small>'}</div>${editable?'<button class="edit" data-action="edit-step" data-step="0" aria-label="تعديل السيارة">تعديل</button>':''}</div><div class="receipt-line">${I('spark')}<div class="grow"><strong>${PACKAGES[d.service].name}</strong><p>${d.extras.length?d.extras.map(k=>EXTRAS[k].name).join('، '):'بدون إضافات'}</p></div>${editable?'<button class="edit" data-action="edit-step" data-step="1" aria-label="تعديل العناية والإضافات">تعديل</button>':''}</div><div class="receipt-line">${I('pin')}<div class="grow"><strong>${esc(d.addressLabel||'المكان')}</strong><p>${esc(d.address)}</p>${d.locationNote?`<p>${esc(d.locationNote)}</p>`:''}</div>${editable?'<button class="edit" data-action="edit-step" data-step="2" aria-label="تعديل الموقع">تعديل</button>':''}</div><div class="receipt-line">${I('calendar')}<div class="grow"><strong>${dateLabel(d.date)} · ${timeLabel(d.time)}</strong><p>بتوقيت دمشق · ${cost(d).minutes} دقيقة تقريبًا</p></div>${editable?'<button class="edit" data-action="edit-step" data-step="3" aria-label="تعديل الموعد">تعديل</button>':''}</div><div class="receipt-line">${I('user')}<div class="grow"><strong>${esc(d.name)}</strong><p class="ltr">${esc(d.phone)}</p></div>${editable?'<button class="edit" data-action="edit-step" data-step="4" aria-label="تعديل بيانات التواصل">تعديل</button>':''}</div>${paymentSummary(d,editable)}${d.note?`<div class="receipt-line">${I('message')}<div class="grow"><strong>ملاحظتك للفني</strong><p>${esc(d.note)}</p></div></div>`:''}</div>`;}
  function bill(d){const c=cost(d);return`<div class="bill"><h3>السعر، بدون مفاجآت.</h3><div class="bill-line"><span>${PACKAGES[d.service].name}</span><span>${money(c.base)} ل.س</span></div><div class="bill-line"><span>حجم السيارة · ${V[d.type].name}</span><span>${c.vehicle?`+${c.vehicle} ل.س`:'ضمن السعر'}</span></div>${c.extraIds.map(k=>`<div class="bill-line"><span>${EXTRAS[k].name}</span><span>+${EXTRAS[k].price} ل.س</span></div>`).join('')}<div class="bill-line"><span>الوصول إلى الموقع</span><span>ضمن سعر التجربة</span></div><div class="bill-line total"><span>الإجمالي</span><strong>${price(c.total)}</strong></div></div>`;}
  function reviewView(){return`${heading('07 / كل شيء واضح',quickMode?'نفس العناية، بموعد جديد.':'غسلتك، مثل ما تحب.',quickMode?'حفظنا سيارتك وخدمتك وعنوانك. راجع الموعد الجديد قبل التأكيد.':'كل اختياراتك أمامك. يمكنك تعديل أي تفصيلة.')}${summary(S.draft)}${bill(S.draft)}<p class="review-note">${S.draft.paymentMethod==='cash'?'كاش بعد الغسيل. لا دفع مسبق.':'يظهر QR بعد التأكيد. الدفع لا يُعتمد دون مطابقة.'}<br>زر التأكيد ينشئ طلبًا على جهازك، وليس فاتورة أو حجزًا فعليًا.</p>`;}
  // Original vector scenes are deliberately labelled as illustrations, not real wash results.
  function sceneArt(view='exterior',before=false){
    const dust=before?`<g clip-path="url(#dust-clip)" opacity=".79"><rect x="37" y="104" width="370" height="63" fill="url(#dust-wash)"/><path d="M42 151q36-23 60-6t61-7 64 3 79-6 90 10v27H42Z" fill="#826e4777"/><g fill="#bea77699">${Array.from({length:32},(_,i)=>`<ellipse cx="${53+(i*47)%333}" cy="${114+(i*13)%44}" rx="${2+(i%5)}" ry="${1+i%3}"/>`).join('')}</g><g stroke="#d5c29b55" stroke-width="2"><path d="m155 124 22 26m31-27 12 27m77-31 20 24m-80-8 49 4"/></g></g>`:'';
    const background=`<rect width="600" height="440" fill="url(#studio-bg)"/><ellipse cx="316" cy="277" rx="270" ry="170" fill="url(#studio-halo)" opacity="${before?'.35':'.7'}"/><path d="M0 338 600 291v149H0Z" fill="#11271e" opacity=".85"/><path d="m0 339 600-48" stroke="#aaca7f24"/><g stroke="#cee1ac0c" fill="none"><circle cx="530" cy="70" r="120"/><circle cx="530" cy="70" r="160"/></g>`;
    if(view==='interior')return`<div class="art-scene"><svg viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${background}<g transform="translate(71,28)"><path d="M50 62 33 347q77 37 160 11l11-105-20-168q-3-28-45-34H90q-31 0-40 11Z" fill="url(#seat-body)" stroke="#627558" stroke-width="2"/><path d="M264 62 247 347q77 37 160 11l11-105-20-168q-3-28-45-34h-49q-31 0-40 11Z" fill="url(#seat-body)" stroke="#627558" stroke-width="2"/><path d="M64 91q0-12 14-12h73q16 1 16 16l9 118q0 17-15 17H73q-15 0-15-19Z" fill="#667861"/><path d="M278 91q0-12 14-12h73q16 1 16 16l9 118q0 17-15 17h-88q-15 0-15-19Z" fill="#667861"/><path d="M76 81v140m20-140v144m20-144v144m20-144v144m20-144v140m134-140v140m20-140v144m20-144v144m20-144v144m20-144v140" stroke="#a3b79755" stroke-width="2"/><path d="M47 252q63-24 132 0l-6 83q-60 20-123-2ZM261 252q63-24 132 0l-6 83q-60 20-123-2Z" fill="url(#seat-cushion)" stroke="#9cb18b66" stroke-width="2"/><rect x="73" y="24" width="85" height="63" rx="20" fill="url(#seat-body)" stroke="#81966d"/><rect x="287" y="24" width="85" height="63" rx="20" fill="url(#seat-body)" stroke="#81966d"/><path d="M205 281h32v80h-32Z" fill="#15251a"/><rect x="204" y="266" width="35" height="33" rx="9" fill="#677c53"/>
      ${before?`<g fill="#473b2899"><ellipse cx="115" cy="185" rx="35" ry="25" transform="rotate(-12 115 185)"/><ellipse cx="104" cy="286" rx="32" ry="13"/><ellipse cx="328" cy="270" rx="39" ry="20" transform="rotate(8 328 270)"/><ellipse cx="336" cy="129" rx="27" ry="36" opacity=".65"/></g><g fill="#c3b191aa">${Array.from({length:29},(_,i)=>`<circle cx="${54+(i*43)%339}" cy="${259+(i*7)%70}" r="2"/>`).join('').replaceAll('NaN','280')}</g>`:`<g fill="none" stroke="#f0ffcb" stroke-width="2" opacity=".8"><path d="m377 76 3 10 10 3-10 3-3 10-3-10-10-3 10-3Z"/><path d="m95 268 2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/></g>`}</g></svg></div>`.replaceAll('x=" seventy"','x="0"');
    return`<div class="art-scene"><svg viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${background}<ellipse cx="305" cy="333" rx="240" ry="24" fill="#06190e" opacity=".6"/><g transform="translate(0 81) scale(1.36)" ${before?'style="filter:saturate(.62) brightness(.88)"':''}><use href="#car-sedan" width="440" height="210"/>${dust}</g>${!before?`<g class="scene-spark" fill="none" stroke="#f0ffc3" stroke-width="2" opacity=".82"><path d="m444 205 3 10 10 3-10 3-3 10-3-10-10-3 10-3Z"/><path d="m202 184 2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/></g>`:''}</svg></div>`;
  }
  function compareMarkup(view='exterior',id='main-compare'){return`<div class="compare" id="${id}" data-compare-view="${view}" style="--split:52%"><div class="scene-layer after-layer">${sceneArt(view,false)}</div><div class="scene-layer before-layer">${sceneArt(view,true)}</div><div class="scene-overlay"></div><span class="compare-label before">قبل</span><span class="compare-label after">بعد</span><div class="compare-divider"><div class="compare-handle">${I('left')}${I('right')}</div></div><label class="sr-only" for="${id}-range">اسحب للمقارنة بين قبل وبعد</label><input class="compare-range" id="${id}-range" type="range" min="0" max="100" value="52" dir="ltr" aria-valuetext="قبل 52 بالمئة، وبعد 48 بالمئة"></div>`;}
  function comparisonShell(view='exterior',id='main-compare',context='order'){return`<div class="completion-shell"><div class="scene-toolbar"><strong>اللمعة في كل تفصيلة</strong><small>THE WASHGO FINISH</small></div><div class="scene-tabs" role="group" aria-label="اختيار زاوية المقارنة"><button class="scene-tab ${view==='exterior'?'active':''}" data-action="scene-view" data-view="exterior" data-context="${context}" aria-pressed="${view==='exterior'}">خارج السيارة</button><button class="scene-tab ${view==='interior'?'active':''}" data-action="scene-view" data-view="interior" data-context="${context}" aria-pressed="${view==='interior'}">المقصورة</button></div>${compareMarkup(view,id)}<p class="compare-caption" data-photo-caption>رسوم توضيحية وليست صور غسلة حقيقية.</p><div class="compare-controls"><button class="btn lime" data-action="play-reveal">${I('play','sm')} شاهد التحوّل</button><button class="icon-btn" data-action="expand-compare" data-context="${context}" aria-label="تكبير مقارنة قبل وبعد">${I('expand','sm')}</button><button class="icon-btn" data-action="reset-compare" aria-label="إعادة المقارنة إلى المنتصف">${I('refresh','sm')}</button></div></div>`;}

  function trackingView(){const o=activeOrder();if(!o)return ordersView();if(o.stage===4)return completionView(o);if(o.stage>=0&&!payServiceAllowed(o))return`${heading('حجز محفوظ · دفع غير مؤكد','نكمّل بعد مراجعة الدفع.','تفاصيلك محفوظة، ولم نرسل طلبًا إلى فني.')}${paymentCard(o)}${summary(o,false)}<div class="row between gap-top"><button class="text-btn" data-action="order-details">ملخص الحجز</button><button class="text-btn danger" data-action="cancel-prompt">إلغاء الحجز التجريبي</button></div>`;if(o.stage===-1)return`${heading('طلب تجريبي','تم إلغاء الحجز.','لم يتم تحصيل أو استرداد أي مبلغ فعلي في هذا النموذج.')}${paymentCard(o)}${summary(o,false)}<button class="btn full gap-top" data-action="quick-rebook" data-id="${esc(o.id)}">حجز جديد بنفس التفاصيل ${I('refresh','sm')}</button>`;const status=STATUS[o.stage];return`<div class="success-head"><div class="success-icon">${I(status.icon)}</div><h1 tabindex="-1">${status.title}</h1><p>${status.description}</p><span class="order-id">${esc(o.id)}</span></div>${paymentCard(o)}<section class="tracking-card" aria-label="متابعة الطلب"><div class="tracking-top"><strong>${status.label}</strong><span class="demo-chip"><span class="dot"></span>محاكاة فقط</span></div>${trackingMap(o.stage)}<div class="timeline">${STATUS.map((s,i)=>`<div class="timeline-item ${i<o.stage?'done':i===o.stage?'current':''}" ${i===o.stage?'aria-current="step"':''}><span>${I(i<o.stage?'check':s.icon)}</span>${s.short}</div>`).join('')}</div></section>${o.stage>0?`<div class="tech-card"><div class="avatar">${I('user')}</div><div class="grow"><h3>أحمد · فني توضيحي</h3><p>شخصية تجريبية، ليست متصلة بالخدمة</p></div><button class="icon-btn" data-action="contact-tech" aria-label="توضيح التواصل مع الفني">${I('message','sm')}</button></div>`:''}<div class="sim-controls"><h3>${I('play','sm')}جرّب رحلة الغسلة</h3><p>تقدّم بين المراحل، ثم شاهد مقارنة قبل وبعد عند الاكتمال.</p><div class="row"><button class="btn" data-action="sim-next">${STATUS[o.stage+1].label} $   function phoneOK(value){return /^\+?\d{8,15}$/.test(digits(value).replace(/[\s()-]/g,''));}
  function plateOK(value){return !value||(/^[A-Za-z\u0621-\u064A0-9\s-]{2,20}$/.test(value)&&/\d/.test(value));}
  function validate(step){errors={};const d=S.draft;if(step===0&&!plateOK(digits(d.plate)))errors.plate='اكتب أرقام اللوحة وحروفها فقط، أو اتركها فارغة.';if(step===2&&str(d.address).length<4)errors.address='حدد مكان السيارة أو أدخل عنوانًا واضحًا قبل المتابعة.';if(step===3&&!available(d.date,d.time))errors.time='اختر موعدًا متاحًا، أو استخدم أقرب موعد.';if(step===4){if(str(d.name).length<2)errors.name='أدخل اسمًا من حرفين على الأقل.';if(!phoneOK(d.phone))errors.phone='أدخل رقمًا تجريبيًا من 8 إلى 15 رقمًا.';}if(step===5&&!methodOf(d))errors.paymentMethod='اختر كيف ستدفع قبل متابعة الحجز.';if(Object.keys(errors).length){render();const key=Object.keys(errors)[0];requestAnimationFrame(()=>{const el=$(`#${key}`)||$(`#error-${key}`);if(el){if(!el.matches('input,textarea'))el.setAttribute('tabindex','-1');el.scrollIntoView({block:'center',behavior:reduced()?'instant':'smooth'});el.focus?.({preventScroll:true});}});$('#announcer').textContent=errors[key];return false;}return true;}
  function next(){if(S.screen!=='booking')return;const now=performance.now();if(now-lastNextAt<350)return;if(!validate(S.step))return;lastNextAt=now;if(S.step===REVIEW){confirmOrder();return;}if(S.editing){S.step=REVIEW;S.editing=false;}else S.step++;touch();updateRoute();render({scroll:true,focus:true,animate:true});}
  function start(service){stopAuto();closeSheet();quickMode=false;const d=S.draft;if(service&&PACKAGES[service]){d.service=service;d.extras=d.extras.filter(k=>!PACKAGES[service].includes.includes(k));}if(!d.name)d.name=S.profile.name;if(!d.phone)d.phone=S.profile.phone;if(!d.carId&&S.cars.length&&!d.carName&&!d.plate){const c=S.cars[0];Object.assign(d,{type:c.type,carId:c.id,carName:c.name,plate:c.plate,color:c.color});}if(!d.address&&S.addresses.length){const a=S.addresses[0];Object.assign(d,{address:a.address,addressLabel:a.label,locationNote:a.locationNote,place:a.place?clone(a.place):null});}if(!dates().some(x=>x.key===d.date)){d.date=earliest()?.date||dates()[0].key;d.time=null;}d.touched=true;go('booking',0);}
  function saveCar(data){let c=S.cars.find(x=>x.id===data.carId)||S.cars.find(x=>data.plate?x.plate===data.plate&&x.type===data.type:x.name===(data.carName||V[data.type].name)&&x.type===data.type&&x.color===data.color);if(!c){if(S.cars.length>=30){toast('وصلت إلى حد 30 سيارة في النموذج. سيستمر الحجز دون إضافة سيارة جديدة.');return null;}c={id:uid('CAR')};S.cars.push(c);}Object.assign(c,{type:data.type,name:str(data.carName,60)||V[data.type].name,plate:str(data.plate,20),color:str(data.color,30)});return c.id;}
  function saveAddress(data,id=null){let a=S.addresses.find(x=>x.id===id)||S.addresses.find(x=>x.address===str(data.address));if(!a){if(S.addresses.length>=20){toast('وصلت إلى حد 20 عنوانًا محفوظًا.');return;}a={id:uid('ADR')};S.addresses.push(a);}Object.assign(a,{label:str(data.addressLabel,30)||'عنوان محفوظ',address:str(data.address),locationNote:str(data.locationNote),place:data.place?clone(data.place):null});}
  function confirmOrder(){if(submitting)return;for(const step of [0,2,3,4,5]){if(!validate(step)){S.step=step;S.editing=false;save();updateRoute(true);render({scroll:true,focus:true});return;}}submitting=true;const d=clone(S.draft);d.plate=digits(d.plate).trim().replace(/\s+/g,' ');d.phone=digits(d.phone).replace(/[\s()-]/g,'');d.name=str(d.name,60);if(d.saveVehicle)d.carId=saveCar(d)||d.carId;if(d.saveAddress)saveAddress(d);const order={...d,id:uid('WG'),stage:0,rating:0,createdAt:new Date().toISOString(),total:cost(d).total,payment:createPayment(d)};S.orders.unshift(order);if(S.orders.length>80)S.orders.length=80;S.profile={name:d.name,phone:d.phone};S.activeOrderId=order.id;S.filter='active';S.draft=blank();S.draft.name=d.name;S.draft.phone=d.phone;S.draft.touched=false;S.editing=false;submitting=false;comparisonView='exterior';save();go(d.paymentMethod==='cash'?'tracking':'payment',0,true);toast(storageOK?'تم حفظ الحجز التجريبي على جهازك.':'تم إنشاء الطلب لهذه الجلسة. التخزين المحلي غير متاح.');}
  function quickRebook(id){const o=S.orders.find(x=>x.id===id);if(!o)return;const slot=earliest();S.draft={...cleanDraft(o),date:slot?.date||dates()[0].key,time:slot?.time||null,touched:true};quickMode=true;go('booking',guardStep(REVIEW));toast('اخترنا أقرب موعد تجريبي جديد. راجع التفاصيل ثم أكّد.');}
  function advance(){const o=activeOrder();if(o&&!payServiceAllowed(o)){stopAuto();toast('تأكيد الدفع مطلوب قبل بدء محاكاة الخدمة.');return;}if(!o||o.stage<0||o.stage>=4){stopAuto();return;}o.stage++;if(o.stage===4){stopAuto();comparisonView='exterior';}save();render({scroll:o.stage===4,focus:o.stage===4,animate:o.stage===4});$('#announcer').textContent=STATUS[o.stage].label;}
  function downloadFile(name,body,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function exportOrder(){const o=activeOrder();if(!o)return;downloadFile(`WashGo-${o.id}.txt`,['WashGo — ملخص تجريبي، ليس فاتورة أو حجزًا فعليًا',`الطلب: ${o.id}`,`الخدمة: ${PACKAGES[o.service].name}`,`السيارة: ${carName(o)}`,`اللوحة: ${o.plate||'غير مضافة'}`,`الموقع: ${o.address}`,`الموعد: ${dateLabel(o.date)} ${timeLabel(o.time)} — توقيت دمشق`,`السعر التجريبي: ${o.total} ل.س`,`الحالة: ${o.stage===-1?'ملغي':STATUS[o.stage].label}`].join('\n'));toast('تم تجهيز ملخص الحجز للتنزيل، دون صور أو رقم جوال.');}

  // Photo storage is local and separate from the small booking JSON.
  const photoMemory=new Map();let dbPromise=null;
  function photoDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('No IndexedDB'));return;}let request;try{request=indexedDB.open('washgo-payments-sy-photos-v6',1);}catch(e){reject(e);return;}request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('photos'))request.result.createObjectStore('photos');};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('IndexedDB unavailable'));request.onblocked=()=>reject(new Error('Database blocked'));});return dbPromise;}
  function photoKey(orderId,view,phase){return`${orderId}:${view}:${phase}`;}
  const validDataURL=value=>typeof value==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(value)&&value.length<2000000;
  const Media={
    async get(id,view,phase){const key=photoKey(id,view,phase);if(photoMemory.has(key))return photoMemory.get(key);try{const db=await photoDB();const val=await new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});if(validDataURL(val)){photoMemory.set(key,val);return val;}}catch{photoStorageOK=false;}return null;},
    async put(id,view,phase,value){if(!validDataURL(value))throw new Error('صيغة الصورة غير صالحة.');const key=photoKey(id,view,phase);photoMemory.set(key,value);try{const db=await photoDB();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(value,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});photoStorageOK=true;}catch{photoStorageOK=false;toast('الصورة متاحة لهذه الجلسة فقط؛ تعذّر حفظها في المتصفح.');}},
    async remove(id,view,phase){const key=photoKey(id,view,phase);photoMemory.delete(key);try{const db=await photoDB();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});return true;}catch{photoStorageOK=false;toast('تعذّر تأكيد حذف الصورة من التخزين. امسح بيانات الموقع من المتصفح إذا لزم.');return false;}},
    async clear(){photoMemory.clear();try{const db=await photoDB();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});return true;}catch{photoStorageOK=false;return false;}}
  };
  async function compressedPhoto(file){if(!file||file.size>12*1024*1024)throw new Error('اختر صورة لا يتجاوز حجمها 12 ميغابايت.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('الصيغ المدعومة: JPEG أو PNG أو WebP.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(!img.width||!img.height||img.width*img.height>32000000)throw new Error('الصورة كبيرة جدًا. اختر صورة لا تتجاوز 32 ميغابكسل.');const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');if(!ctx)throw new Error('معالجة الصور غير متاحة في هذا المتصفح.');ctx.fillStyle='#f3f6ed';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78);}finally{URL.revokeObjectURL(url);}}
  async function technicianSheet(){stopAuto();const o=activeOrder();if(!o)return;const id=o.id,view=photoView;showSheet('مساحة الفني · تجربة محلية',`<p class="sheet-intro">صوّر نفس الزاوية قبل الغسيل وبعده لتكون المقارنة واضحة. هذه ليست واجهة فني موثّقة أو متصلة بخادم.</p><div class="row between" style="margin-bottom:14px"><strong class="small">${esc(carName(o))}</strong>${plateMarkup(o.plate)}</div><div class="segmented" role="group" aria-label="زاوية صور الفني"><button class="${view==='exterior'?'active':''}" data-action="photo-view" data-view="exterior" aria-pressed="${view==='exterior'}">خارج السيارة</button><button class="${view==='interior'?'active':''}" data-action="photo-view" data-view="interior" aria-pressed="${view==='interior'}">المقصورة</button></div><div class="photo-workspace">${['before','after'].map(phase=>`<section class="photo-box" data-photo-box="${phase}"><h3>${phase==='before'?'قبل الغسيل':'بعد الغسيل'}</h3><div class="photo-placeholder">${I('camera')}اختر صورة أو التقطها</div><label class="upload-label">${I('camera')}التقاط صورة<input class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" data-photo="${phase}" data-view="${view}" data-order="${esc(id)}" aria-label="التقاط صورة ${phase==='before'?'قبل':'بعد'} الغسيل"></label><label class="upload-label" style="background:#e1ebd5;color:#3e6132">${I('image')}من الجهاز<input class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" data-photo="${phase}" data-view="${view}" data-order="${esc(id)}" aria-label="اختيار صورة ${phase==='before'?'قبل':'بعد'} من الجهاز"></label><button class="photo-delete" data-action="remove-photo" data-phase="${phase}" data-view="${view}" data-order="${esc(id)}" hidden>حذف الصورة</button></section>`).join('')}</div><p class="photo-status" id="photo-status" role="status">جارٍ قراءة الصور المحلية…</p><p class="media-privacy">صور JPEG / PNG / WebP حتى 12 ميغابايت. تُصغّر الصور وتُعاد معالجتها محليًا دون بيانات EXIF. تجنّب ظهور الأشخاص واللوحات غير الضرورية، ولا تستخدم صور الآخرين دون إذن.</p><button class="btn full" data-action="done-photos">${I('check','sm')}حفظ والعودة</button>`,'technician');
    const [before,after]=await Promise.all([Media.get(id,view,'before'),Media.get(id,view,'after')]);if(sheetMode!=='technician'||activeOrder()?.id!==id||photoView!==view)return;for(const [phase,data] of [['before',before],['after',after]]){const box=$(`[data-photo-box="${phase}"]`);if(data){box.querySelector('.photo-placeholder').outerHTML=`<img src="${data}" alt="صورة ${phase==='before'?'قبل':'بعد'} الغسيل التي اخترتها">`;box.querySelector('.photo-delete').hidden=false;}}
    $('#photo-status').textContent=before&&after?'صورتان جاهزتان للمقارنة. محفوظتان محليًا.':before||after?'أضف الصورة المقابلة لعرض مقارنة حقيقية. لن نخلط صورك بالرسوم التوضيحية.':'لم تضف صورًا بعد. النتيجة الافتراضية تستخدم رسومًا توضيحية.';if(!photoStorageOK)$('#photo-status').textContent+=' الحفظ الدائم غير متاح حاليًا.';
  }
  async function handlePhoto(input){if(photoBusy){toast('انتظر انتهاء معالجة الصورة الحالية.');return;}const file=input.files?.[0],id=input.dataset.order,view=input.dataset.view,phase=input.dataset.photo;if(!file||!S.orders.some(o=>o.id===id))return;photoBusy=true;if($('#photo-status'))$('#photo-status').textContent='جارٍ تصغير الصورة وحفظها على جهازك…';try{const data=await compressedPhoto(file);await Media.put(id,view,phase,data);if(sheetMode==='technician'&&activeOrder()?.id===id&&photoView===view)await technicianSheet();if(S.screen==='tracking'&&activeOrder()?.id===id&&activeOrder()?.stage===4)hydrateComparison($('#main .compare'),activeOrder(),comparisonView);toast(photoStorageOK?'تم حفظ الصورة على جهازك فقط.':'الصورة متاحة لهذه الجلسة فقط.');}catch(err){toast(err.message||'تعذرت قراءة الصورة. جرّب ملف JPEG آخر.');if($('#photo-status'))$('#photo-status').textContent='تعذرت معالجة الصورة. يمكنك المحاولة من جديد.';}finally{photoBusy=false;if(input.isConnected)input.value='';}}
  async function hydrateComparison(el,order,view,animate=false){if(!el)return;const id=order?.id,shell=el.closest('.completion-shell'),caption=shell?.querySelector('[data-photo-caption]');let before=null,after=null;if(id)[before,after]=await Promise.all([Media.get(id,view,'before'),Media.get(id,view,'after')]);if(!el.isConnected||el.dataset.compareView!==view)return;const scaffold=document.createElement('div');scaffold.innerHTML=compareMarkup(view,el.id);el.innerHTML=scaffold.firstElementChild.innerHTML;setSplit(el,52);const partial=Boolean(before)!==Boolean(after);if(partial){el.innerHTML=`<div class="no-pair">${I('image')}<div><h3>نحتاج صورتين لنُظهر الفرق.</h3><p>لديك صورة ${before?'قبل':'بعد'} فقط لهذه الزاوية.<br>أضف الصورة الأخرى من مساحة الفني.</p></div></div>`;if(caption)caption.textContent='لا نخلط صورة حقيقية مع رسم توضيحي.';}else if(before&&after){$('.before-layer',el).innerHTML=`<img src="${before}" alt="قبل الغسيل، صورة اخترتها من جهازك">`;$('.after-layer',el).innerHTML=`<img src="${after}" alt="بعد الغسيل، صورة اخترتها من جهازك">`;if(caption)caption.textContent='صور من جهازك · اسحب الفاصل لرؤية الفرق.';}else if(caption)caption.textContent='رسوم توضيحية، وليست صور غسلة حقيقية. اسحب للمقارنة.';shell?.querySelectorAll('[data-action="play-reveal"],[data-action="reset-compare"],[data-action="expand-compare"]').forEach(b=>b.disabled=partial);

    else if(e.target.id==='address-form'){e.preventDefault();const form=new FormData(e.target),address=str(form.get('address')),label=str(form.get('addressLabel'),30)||'مكان الغسيل',note=str(form.get('locationNote'));if(address.length<4){$('#address-error').textContent='أدخل عنوانًا من أربعة أحرف على الأقل.';$('#sheet-address').focus();return;}const d={address,addressLabel:label,locationNote:note,place:sheetAddress?.place||{kind:'manual',x:350,y:250,label:'عنوان يدوي'},saveAddress:sheetContext==='account'||form.has('saveAddress')};if(sheetContext==='account'){saveAddress(d,sheetAddress?.id);save();render();savedAddressesSheet();toast('تم حفظ العنوان.');}else{Object.assign(S.draft,d);delete errors.address;touch();closeSheet();render();toast('تم تحديد مكان الغسيل.');}}
    else if(e.target.id==='profile-form'){e.preventDefault();const f=new FormData(e.target),name=str(f.get('profileName'),60),phone=digits(str(f.get('profilePhone'),24)).replace(/[\s()-]/g,'');if(name.length<2){$('#profile-error').textContent='أدخل اسمًا من حرفين على الأقل.';return;}if(phone&&!phoneOK(phone)){$('#profile-error').textContent='أدخل رقمًا من 8 إلى 15 رقمًا، أو اتركه فارغًا.';return;}S.profile={name,phone};save();closeSheet();render();toast('تم حفظ بياناتك التجريبية.');}
  });

  function trackingMap(stage){
    const positions=[[66,122],[95,103],[202,96],[307,51],[327,39]],pos=positions[Math.max(0,stage)];
    return `<div class="tracking-map" aria-label="مسار توضيحي للفني، ليس تتبعًا حقيقيًا"><svg viewBox="0 0 420 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="420" height="170" fill="#e4ecda"/><g fill="#d4e2c4"><rect x="21" y="13" width="67" height="43" rx="8"/><rect x="264" y="114" width="100" height="47" rx="13"/><rect x="136" y="17" width="48" height="55" rx="8"/><rect x="340" y="10" width="69" height="65" rx="12"/></g><g stroke="#fffef6" stroke-width="15" fill="none"><path d="M0 86h420M112 0v170M239 0v170M0 147h420M304 0v170"/></g><path class="route-path" d="m66 122 46 0 0-36 127 0 65 0V40h23"/><circle cx="327" cy="40" r="17" fill="#176448" stroke="white" stroke-width="4"/><g transform="translate(316,29)" stroke="#e3f6c6" stroke-width="1.7" fill="none"><path d="m3 10 8-7 8 7v10H3V10Z"/><path d="M8 20v-7h6v7"/></g><g class="route-car" transform="translate(${pos[0]},${pos[1]})"><circle r="18" fill="#d7f6a2" stroke="white" stroke-width="3"/><g transform="translate(-11,-11)" stroke="#214e33" stroke-width="1.6" fill="none"><path d="M2 5h12v12H2V5Zm12 4h4l3 4v4h-7"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></g></g></svg></div>`;
  }
  function mapMarkup(point){const p=point||{x:350,y:250};return`<div class="location-map" id="location-map" tabindex="0" role="group" aria-label="خريطة توضيحية. انقر لتحديد الدبوس، واسحب للتحريك. تدعم الأسهم والتكبير."><div class="map-world" id="map-world">${mapSVG()}<div class="map-pin" id="map-pin" style="left:${p.x}px;top:${p.y}px"><svg viewBox="0 0 38 48" aria-hidden="true"><path d="M19 1C9 1 2 8 2 18c0 12 17 28 17 28s17-16 17-28C36 8 29 1 19 1Z" fill="#1d6042" stroke="white" stroke-width="3"/><circle cx="19" cy="18" r="6" fill="#ddf8b4"/></svg></div></div><div class="map-controls"><button type="button" data-action="map-zoom" data-delta=".2" aria-label="تكبير الخريطة">${I('plus')}</button><button type="button" data-action="map-zoom" data-delta="-.2" aria-label="تصغير الخريطة">${I('minus')}</button></div><button type="button" class="map-location-button" data-action="geolocate">${I('target')}موقعي الحالي</button><span class="map-caption">خريطة توضيحية · ليست للملاحة</span></div>`;}
  function initMap(){const map=$('#location-map'),world=$('#map-world'),pin=$('#map-pin');if(!map)return;const cfg={zoom:1,panX:0,panY:0},pointers=new Map();let gesture=null,pinch=null,hadPinch=false;const bound=(n,min,max)=>Math.min(max,Math.max(min,n));const draw=()=>world.style.transform=`translate(-50%,-50%) translate(${cfg.panX}px,${cfg.panY}px) scale(${cfg.zoom})`;const setPoint=(x,y)=>{if(!sheetAddress)return;x=bound(x,20,680);y=bound(y,20,480);sheetAddress.place={kind:'map',x:Math.round(x),y:Math.round(y),label:'نقطة مختارة على الخريطة التوضيحية'};pin.style.left=`${x}px`;pin.style.top=`${y}px`;$('#pin-description').textContent=sheetAddress.place.label;if(!sheetAddress.address||sheetAddress.address.includes('تجريبي')){sheetAddress.address='دمشق، موقع مختار على الخريطة التوضيحية';$('#sheet-address').value=sheetAddress.address;}$('#announcer').textContent='تم اختيار نقطة جديدة على الخريطة التوضيحية.';};const zoom=delta=>{cfg.zoom=bound(cfg.zoom+delta,.7,2.2);draw();};mapAPI={zoom};map.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){hadPinch=false;gesture={x:e.clientX,y:e.clientY,panX:cfg.panX,panY:cfg.panY,moved:false};}else if(pointers.size===2){hadPinch=true;const[a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:cfg.zoom};}});map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const[a,b]=[...pointers.values()];cfg.zoom=bound(pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.distance),.7,2.2);draw();}else if(pointers.size===1&&gesture&&!hadPinch){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>5)gesture.moved=true;if(gesture.moved){cfg.panX=bound(gesture.panX+dx,-250,250);cfg.panY=bound(gesture.panY+dy,-190,190);draw();}}});map.addEventListener('pointerup',e=>{if(!pointers.has(e.pointerId))return;if(pointers.size===1&&gesture&&!gesture.moved&&!hadPinch){const r=map.getBoundingClientRect();setPoint((e.clientX-r.left-r.width/2-cfg.panX)/cfg.zoom+350,(e.clientY-r.top-r.height/2-cfg.panY)/cfg.zoom+250);}pointers.delete(e.pointerId);if(!pointers.size){gesture=null;pinch=null;hadPinch=false;}});map.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null;pinch=null;hadPinch=false;});map.addEventListener('keydown',e=>{if(e.target.closest('button'))return;const p=sheetAddress?.place||{x:350,y:250},m={ArrowLeft:[-15,0],ArrowRight:[15,0],ArrowUp:[0,-15],ArrowDown:[0,15]}[e.key];if(m){e.preventDefault();setPoint(p.x+m[0],p.y+m[1]);}if(e.key==='+'||e.key==='='){e.preventDefault();zoom(.2);}if(e.key==='-'){e.preventDefault();zoom(-.2);}});map.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?.1:-.1);}},{passive:false});draw();}
  function geolocate(btn){if(!navigator.geolocation){toast('تحديد الموقع غير مدعوم. يمكنك كتابة العنوان يدويًا.');return;}if(!window.isSecureContext){toast('قد يحتاج الموقع HTTPS. الإدخال اليدوي متاح دائمًا.');return;}btn.disabled=true;btn.innerHTML='<span class="loading-dot"></span>جارٍ تحديد الموقع';const restore=()=>{if(btn.isConnected){btn.disabled=false;btn.innerHTML=`${I('target')}موقعي الحالي`;}};navigator.geolocation.getCurrentPosition(pos=>{restore();if(sheetMode!=='address'||!sheetAddress)return;const distance=Math.hypot((pos.coords.latitude-24.7136)*111,(pos.coords.longitude-46.6753)*101);if(distance>65){toast('موقعك خارج نطاق دمشق التوضيحي. جرّب عنوانًا يدويًا.');return;}sheetAddress.place={kind:'gps',x:350,y:250,label:'موقع داخل نطاق دمشق التقريبي، أكمل العنوان'};$('#pin-description').textContent=sheetAddress.place.label;toast('أنت ضمن نطاق العرض التقريبي. اكتب العنوان؛ الخريطة ليست جغرافية.');},err=>{restore();toast(err.code===1?'لم تسمح بالموقع. يمكنك كتابة العنوان أو اختيار عنوان تجريبي.':'تعذر تحديد الموقع. استخدم الإدخال اليدوي.');},{enableHighAccuracy:false,timeout:8000,maximumAge:60000});}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAuto();stopReveal();}else if(S.screen==='tracking')render();});

  document.addEventListener('pointerdown',e=>{if(reduced()||e.button!==0)return;const b=e.target.closest('.btn,.hero-cta,.icon-btn,.signature-car,.service-option,.date,.time');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),wave=document.createElement('span');wave.className='tap-wave';wave.setAttribute('aria-hidden','true');wave.style.left=`${e.clientX-r.left}px`;wave.style.top=`${e.clientY-r.top}px`;b.appendChild(wave);setTimeout(()=>wave.remove(),520);});
  $('.skip')?.addEventListener('click',e=>{e.preventDefault();const target=$('#main h1')||$('#main');target.setAttribute('tabindex','-1');target.focus();});
  motionQuery.addEventListener?.('change',()=>applyMotion());
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.screen==='booking'&&!$('#sheet').open&&e.target.matches('input[data-field]')){e.preventDefault();next();}});
  document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type="radio"]):not([type="checkbox"]),textarea')){document.documentElement.classList.add('keyboard-entry');setTimeout(()=>e.target.isConnected&&e.target.scrollIntoView({block:'center',behavior:reduced()?'instant':'smooth'}),160);}});
  document.addEventListener('focusout',()=>document.documentElement.classList.remove('keyboard-entry'));

  window.addEventListener('pagehide',()=>{stopAuto();stopReveal();save();});
  payEventListeners();
  if(location.hash)fromRoute();else{save();updateRoute(true);render();}
})();</script></body></html>
