<script>'use strict';
(() => {
  // UI approval only. No API, login, dispatch, payment processor or map provider is connected.
  const VERSION = 1;
  const KEY = 'washgo-technician-approval-v1';
  const $ = (q, root = document) => root.querySelector(q);
  const $$ = (q, root = document) => [...root.querySelectorAll(q)];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const I = (name, cls='') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const money = n => `${Math.round(n).toLocaleString('en-US')}<span class="currency">ل.س</span>`;
  const now = () => new Date().toISOString();
  const timeLabel = date => new Date(date).toLocaleTimeString('ar-SY', {hour:'2-digit',minute:'2-digit'});
  const clone = v => JSON.parse(JSON.stringify(v));
  const STAGES = Object.freeze(['assigned','accepted','route','before','wash','after','handoff','closed']);
  const PHASES = ['المهمة','الطريق','قبل الغسيل','العناية','بعد الغسيل','التسليم'];
  const SEEDS = Object.freeze([
    {id:'WG-2041', time:'09:30', minutes:70, car:'تويوتا كورولا', type:'sedan', color:'أبيض', plate:'128450', service:'نظافة متكاملة', detail:'داخلي + خارجي', base:900, extra:150, extraName:'عناية إضافية بالإطارات', area:'المزة', address:'دمشق · المزة · عنوان عرض رقم 12', distance:'2.4', eta:12, customer:'سامر · عميل تجريبي', note:'السيارة عند المدخل الجانبي. يرجى التواصل عند الوصول.', method:'cash', payment:'due'},
    {id:'WG-2042', time:'11:30', minutes:80, car:'هيونداي توسان', type:'suv', color:'رمادي', plate:'245670', service:'عناية شاملة', detail:'داخلي + خارجي · سيارة كبيرة', base:1300, extra:0, extraName:'', area:'كفرسوسة', address:'دمشق · كفرسوسة · عنوان عرض رقم 8', distance:'3.1', eta:16, customer:'ريم · عميلة تجريبية', note:'الموقف المخصص بجانب بوابة المبنى. بيانات المكان للتوضيح.', method:'sham', payment:'pending'},
    {id:'WG-2043', time:'14:00', minutes:35, car:'كيا سيراتو', type:'sedan', color:'فضي', plate:'367810', service:'لمعة خارجية', detail:'غسيل خارجي', base:650, extra:0, extraName:'', area:'المالكي', address:'دمشق · المالكي · عنوان عرض رقم 5', distance:'4.0', eta:19, customer:'عمر · عميل تجريبي', note:'غسيل خارجي فقط؛ لا توجد حاجة إلى دخول المقصورة.', method:'syriatel', payment:'verified'}
  ]);
  const CHECKS = Object.freeze([
    {name:'الهيكل والزجاج', desc:'تنظيف الخارج وإزالة آثار الماء', icon:'drop'},
    {name:'الجنوط والإطارات', desc:'تنظيف الزوايا والتأكد من النتيجة', icon:'wheel'},
    {name:'المقصورة الداخلية', desc:'المقاعد والأسطح والأرضيات', icon:'seat'},
    {name:'فحص الجودة النهائي', desc:'مراجعة اللمعة وتجهيز السيارة للتسليم', icon:'spark'}
  ]);
  const stageIndex = j => ({assigned:0,accepted:0,route:1,before:2,wash:3,after:4,handoff:5,closed:5})[j.stage];
  const checkList = j => j.id === 'WG-2043' ? CHECKS.filter(x => x.icon !== 'seat') : CHECKS;
  const newState = () => ({version:VERSION,ready:true,motion:true,feedback:'',jobs:SEEDS.map(s => ({...clone(s),stage:'assigned',checks:[],photos:{before:[null,null],after:[null,null]},notes:'',cash:'due',cashIssue:'',issue:'',closedAt:null,startedAt:null,history:[]}))});
  let storageOK = true, storageCorrupt = false, S = newState();
  function load() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch { storageOK = false; return; }
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (data.version !== VERSION || !Array.isArray(data.jobs)) throw new Error('invalid prototype state');
      S.ready = typeof data.ready === 'boolean' ? data.ready : true;
      S.motion = typeof data.motion === 'boolean' ? data.motion : true;
      S.feedback = String(data.feedback || '').slice(0,2500);
      for (const j of S.jobs) {
        const saved = data.jobs.find(x => x && x.id === j.id);
        if (!saved) continue;
        if (STAGES.includes(saved.stage)) j.stage = saved.stage;
        j.checks = Array.isArray(saved.checks) ? saved.checks.filter(n => Number.isInteger(n) && n >= 0 && n < checkList(j).length) : [];
        j.checks = [...new Set(j.checks)];
        for (const phase of ['before','after']) for (let index=0;index<2;index++) {
          const p = saved.photos?.[phase]?.[index];
          if (p?.kind === 'demo') j.photos[phase][index] = {kind:'demo'};
          else if (p?.kind === 'local' && typeof p.data === 'string' && p.data.length < 850000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.data)) j.photos[phase][index] = {kind:'local',data:p.data};
        }
        j.notes = String(saved.notes || '').slice(0,800);
        j.issue = String(saved.issue || '').slice(0,500);
        j.cashIssue = String(saved.cashIssue || '').slice(0,500);
        j.cash = j.method === 'cash' && saved.cash === 'collected' && ['handoff','closed'].includes(j.stage) ? 'collected' : 'due';
        for (const key of ['startedAt','closedAt']) if (typeof saved[key] === 'string' && Number.isFinite(Date.parse(saved[key]))) j[key] = saved[key];
        j.history = Array.isArray(saved.history) ? saved.history.filter(x => x && typeof x.text === 'string' && Number.isFinite(Date.parse(x.at))).slice(-35).map(x => ({text:x.text.slice(0,180),at:x.at})) : [];
        // A partially saved draft never bypasses evidence gates on restore.
        if (['wash','after'].includes(j.stage) && !j.photos.before.some(Boolean)) j.stage = 'before';
        if (j.stage === 'after' && j.checks.length !== checkList(j).length) j.stage = 'wash';
      }
    } catch { storageOK = false; storageCorrupt = true; }
  }
  load();
  let view = 'home', selectedId = null, taskFilter = 'active', collectionFilter = 'all';
  let toastTimer, revealFrame, photoBusy = false, photoRevision = 0, zoom = 1, sheetReturn = null, sheetContext = null;
  let lock = false;
  const main = $('#main'), header = $('#header'), dock = $('#dock'), sheet = $('#sheet');
  const reducedQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => !S.motion || reducedQuery.matches;
  const job = () => S.jobs.find(j => j.id === selectedId);
  const total = j => j.base + j.extra;
  const collected = j => j.method === 'cash' && j.cash === 'collected';
  const outstanding = j => j.method === 'cash' ? j.cash !== 'collected' : j.payment !== 'verified';
  const activeWork = () => S.jobs.find(j => ['route','before','wash','after','handoff'].includes(j.stage));
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; storageCorrupt = false; }
    catch { storageOK = false; }
    updateStorage();
  }
  function updateStorage() {
    const el = $('#storage-warning');
    el.hidden = storageOK;
    el.textContent = storageCorrupt ? 'تعذر استعادة بعض بيانات التجربة؛ فُتح جدول جديد. لا تعتمد على هذا النموذج كسجل عمل.' : 'الحفظ المحلي غير متاح الآن؛ تبقى التغييرات في هذه الجلسة وقد تُفقد عند الإغلاق.';
  }
  function record(j, text) { j.history.push({text,at:now()}); j.history = j.history.slice(-35); }
  function toast(text) {
    clearTimeout(toastTimer); $('#toast').textContent = text; $('#toast').classList.add('show');
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 3800);
  }
  function stopReveal(){ if (revealFrame) { cancelAnimationFrame(revealFrame); $$('[data-action=reveal]').forEach(b=>b.innerHTML=`${I('play')}شاهد التحوّل`); } revealFrame = null; }
  function nav(next, id = null, back = false) {
    closeSheet(); stopReveal(); zoom=1;
    view = ['home','tasks','collections','profile','task'].includes(next) ? next : 'home';
    selectedId = S.jobs.some(j => j.id === id) ? id : null;
    if (view === 'task' && !selectedId) view = 'home';
    try { history.pushState({washgoTech:true,view,id:selectedId}, '', location.href); } catch {}
    render({animate:true,back,scroll:true});
  }
  function refresh(animate=false) { render({animate,scroll:false}); }
  function render({animate=false,back=false,scroll=false}={}) {
    stopReveal();
    const oldFocus = document.activeElement?.getAttribute('data-focus');
    document.documentElement.dataset.motion = S.motion ? 'on' : 'off';
    document.documentElement.dataset.view = view;
    header.innerHTML = renderHeader();
    main.innerHTML = view==='home'?renderHome():view==='tasks'?renderTasks():view==='collections'?renderCollections():view==='profile'?renderProfile():renderTask();
    dock.innerHTML = view==='task'?renderTaskDock():renderNav();
    main.className = 'main' + (animate ? back ? ' screen-back':' screen-enter' : '');
    updateStorage();
    updateDock();
    if (scroll) { window.scrollTo({top:0,behavior:'instant'}); const title = $('h1',main); if(title){title.tabIndex=-1;title.focus({preventScroll:true});} }
    else if (oldFocus) { const target = $$('[data-focus]').find(el => el.dataset.focus === oldFocus); target?.focus({preventScroll:true}); }
  }
  function updateDock() {
    const height = dock.firstElementChild?.getBoundingClientRect().height || 86;
    document.documentElement.style.setProperty('--dock', `${Math.ceil(height)}px`);
  }
  function brand(){return `<div class="brand">WashGo<span>.</span><small>مساحة الفني</small></div>`;}
  function renderHeader() {
    if(view==='task') return `<button class="icon-button" data-action="home" aria-label="العودة إلى يومي">${I('right')}</button><div class="header-center"><strong>مهمة <bdi>${escape(job().id)}</bdi></strong><small>${escape(job().area)} · ${escape(job().time)} · بيانات تجريبية</small></div><button class="icon-button" data-action="task-menu" aria-label="خيارات المهمة">${I('more')}</button>`;
    return `<button class="row" style="padding:0;background:none;text-align:start" data-action="profile" aria-label="الحساب التجريبي"><span class="avatar" aria-hidden="true">أح</span>${brand()}</button><button class="icon-button" data-action="notifications" aria-label="إشعارات التجربة">${I('bell')}<i class="alert-dot"></i></button>`;
  }
  function renderNav(){return `<nav class="bottom-nav" aria-label="التنقل الرئيسي">${[['home','grid','يومي'],['tasks','calendar','المهام'],['collections','wallet','التحصيل'],['profile','user','حسابي']].map(([key,icon,label]) => `<button class="nav-item" data-action="${key}" ${view===key?'aria-current="page"':''}><span class="nav-icon">${I(icon)}</span>${label}</button>`).join('')}</nav>`;}
  function plate(j){return `<span class="plate"><small>لوحة<br>تجريبية</small><strong>${escape(j.plate)}</strong></span>`;}
  function car(j, cls='mini-car'){return `<div class="${cls}" aria-hidden="true"><svg class="car-symbol" viewBox="0 0 440 210"><use href="#car-${j.type}"/></svg></div>`;}
  function status(j){
    const names={assigned:'جديد',accepted:'تم الاستلام',route:'في الطريق',before:'وصلت للموقع',wash:'جاري العناية',after:'توثيق النتيجة',handoff:'جاهز للتسليم',closed:j.issue==='deferred'?'أُعيد للإدارة':'مكتمل'};
    return `<span class="pill ${j.stage==='assigned'?'amber':j.stage==='closed'?'success':''}"><i class="light-dot"></i>${names[j.stage]}</span>`;
  }
  function paymentLabel(j) {
    if(j.method==='cash') return collected(j)?'كاش · تم التحصيل':'كاش بعد الغسيل';
    return j.method==='sham'?'شام كاش':'سيريتل كاش';
  }
  function paymentPill(j){return `<span class="pill ${outstanding(j)&&j.method!=='cash'?'amber':!outstanding(j)?'success':''}">${I(j.method==='cash'?'banknote':'shield')}${paymentLabel(j)}${j.method!=='cash'?' · '+(j.payment==='verified'?'معتمد تجريبيًا':'قيد المراجعة'):''}</span>`;}
  function jobCard(j, featured=false) {
    return `<article class="job-card ${featured?'featured':''}" aria-label="مهمة ${j.id}">
      <div class="row between"><div><div class="job-time"><bdi>${escape(j.time)}</bdi><small>اليوم</small></div><div class="job-meta"><bdi>${j.id}</bdi> · ${j.minutes} دقيقة للخدمة</div></div>${status(j)}</div>
      <div class="job-vehicle"><div><h3>${escape(j.car)}</h3><p class="small muted">${escape(j.color)} · ${j.type==='sedan'?'سيدان':'سيارة كبيرة'}</p>${plate(j)}</div>${car(j)}</div>
      <div class="job-service">${I(j.id==='WG-2043'?'drop':'spark','small')}<span>${escape(j.service)}</span>${j.extra?'<span class="pill">+ إضافة</span>':''}</div>
      <div class="job-footer"><div class="row between"><span class="job-location">${I('pin','small')}${escape(j.area)} · ${j.distance} كم توضيحيًا</span><span class="job-amount">${money(total(j))}</span></div><div class="row between" style="margin-top:10px">${paymentPill(j)}</div></div>

    </article>`;
  }
  function renderHome(){
    const closed=S.jobs.filter(j => j.stage==='closed'&&j.issue!=='deferred').length;
    const next=activeWork() || S.jobs.find(j=>j.stage!=='closed');
    const later=S.jobs.filter(j=>j!==next&&j.stage!=='closed');
    const date = new Date().toLocaleDateString('ar-SY',{weekday:'long',day:'numeric',month:'long'});
    return `<section class="hero"><div class="hero-top row between"><span class="date-pill">${I('sun','small')}${escape(date)}</span><button class="switch" role="switch" aria-checked="${S.ready}" data-action="ready" aria-label="الجاهزية التجريبية للمهام"><span>${S.ready?'جاهز للمهام':'استراحة'}</span><span class="switch-track"></span></button></div><div class="hero-body"><div><small>مرحبًا، أحمد</small><h1>يومك منظّم.</h1><p>خطوة واضحة لكل مهمة.</p></div><div class="hero-art"><span class="tile-icon">${I('car')}</span>${I('spark','spark')}</div></div><div class="hero-foot"><span><strong>${closed}</strong> / ${S.jobs.length} مهام أنجزتها في العرض</span><span class="hero-meter"><i style="width:${closed/S.jobs.length*100}%"></i></span><span>جدول تجريبي</span></div></section>
    ${!S.ready?`<div class="note amber mt">${I('pause')}<span>أنت في استراحة تجريبية. يمكنك متابعة مهمة بدأتَها؛ استلام مهمة جديدة يتطلب تفعيل الجاهزية.</span></div>`:''}
    <div class="section-title"><h2>${activeWork()?'مهمتك الحالية':'موعدك القادم'}</h2><small>مسند إليك من الإدارة</small></div>
    ${next?jobCard(next,true):`<div class="empty"><span class="tile-icon lime">${I('check')}</span><h3>أنهيت جدول العرض</h3><p>كل مهمة مكتملة تحتفظ بصورها وحالة دفعها.</p><button class="btn soft" data-action="tasks">عرض المهام</button></div>`}
    ${later.length?`<div class="section-title"><h2>بعدها في جدولك</h2><button class="text-btn" data-action="tasks">كل المهام ${I('left')}</button></div>${later.map(j=>jobCard(j)).join('')}`:''}
    <button class="quick-panel full" data-action="guide" style="text-align:start;margin-top:20px"><span class="tile-icon lime">${I('play')}</span><span class="grow"><strong>جرّب رحلة الفني كاملة</strong><p>من استلام المهمة إلى اللمعة الأخيرة.</p></span>${I('left','small')}</button><div class="design-footer">WASHGO · TECHNICIAN EXPERIENCE · PROTOTYPE 01</div>`;
  }
  function renderStepper(j){const n=stageIndex(j);return `<div class="stepper"><div class="stepper-head"><span>رحلة المهمة</span><span class="ltr">${String(n+1).padStart(2,'0')} / 06</span></div><ol class="steps">${PHASES.map((label,i)=>`<li class="${i===n?'current':i<n?'done':''}" ${i===n?'aria-current="step"':''}><i></i>${label}</li>`).join('')}</ol></div>`;}
  function heading(title,desc,icon){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><span class="tile-icon lime large">${I(icon)}</span></div>`;}
  function paymentSummary(j){return `<section class="card payment-summary row"><span class="tile-icon ${outstanding(j)&&j.method!=='cash'?'amber':'lime'}">${I(j.method==='cash'?'banknote':'shield')}</span><div class="grow"><h3>${paymentLabel(j)}</h3><p>${j.method==='cash'?(collected(j)?'تم تسجيل التحصيل محليًا':'يُحصّل المبلغ بعد إنهاء الغسيل'):(j.payment==='verified'?'اعتماد مفترض لعرض هذا السيناريو':'التحويل بانتظار مطابقة الإدارة')}</p></div></section>`;}
  function details(j){
    return `${heading(j.stage==='accepted'?'جاهز للانطلاق؟':'مهمة جديدة، لمعة جديدة.',j.stage==='accepted'?'استلمت المهمة. ابدأ التوجّه عندما تكون جاهزًا.':'راجع التفاصيل قبل استلام المهمة المسندة إليك.','work')}
    ${j.issue?`<div class="note amber" style="margin-bottom:14px">${I('flag')}<span>ملاحظة محفوظة محليًا: ${escape(j.issue)}</span></div>`:''}
    <section class="vehicle-showcase"><div class="row between"><span class="pill">${j.type==='sedan'?'سيدان':'سيارة كبيرة'} · ${escape(j.color)}</span>${plate(j)}</div>${car(j,'big-car')}<div class="row between"><div><h2>${escape(j.car)}</h2><p class="tiny muted">تأكد من اللوحة عند الوصول</p></div><span class="tile-icon">${I('car')}</span></div></section>
    <section class="card mt"><div class="detail-row" style="padding-top:0"><span class="tile-icon">${I('spark')}</span><div class="grow"><strong>${escape(j.service)}</strong><p>${escape(j.detail)} · ${j.minutes} دقيقة تقديرية</p></div><strong>${money(total(j))}</strong></div>${j.extra?`<div class="detail-row"><span class="tile-icon">${I('plus')}</span><div class="grow"><strong>${escape(j.extraName)}</strong><p>مشمولة في إجمالي الطلب</p></div></div>`:''}<div class="detail-row"><span class="tile-icon">${I('pin')}</span><div class="grow"><strong>${escape(j.area)}</strong><p>${escape(j.address)}</p></div></div><div class="detail-row"><span class="tile-icon">${I('calendar')}</span><div class="grow"><strong>اليوم · <bdi>${escape(j.time)}</bdi></strong><p>موعد مجدول للتجربة، وليس طلب وصول فوري</p></div></div><div class="detail-row"><span class="tile-icon">${I('user')}</span><div class="grow"><strong>${escape(j.customer)}</strong><p>بيانات العميل توضيحية</p></div><button class="icon-button" data-action="contact" aria-label="خيارات التواصل التجريبية">${I('phone')}</button></div><p class="customer-note">${escape(j.note)}</p></section>
    <div class="mt">${paymentSummary(j)}</div><section class="card mt" style="padding-block:1px"><button class="menu-row" data-action="breakdown">${I('receipt-pay')}<span class="grow"><strong>تفاصيل المبلغ</strong><small>قيمة الطلب، وليست أرباح الفني.</small></span>${I('left')}</button><button class="menu-row" data-action="history">${I('history')}<span class="grow"><strong>سجل المهمة</strong></span>${I('left')}</button></section>`;
  }
  function mapMarkup(){return `<div class="map" aria-label="خريطة توضيحية لا تعتمد عليها للملاحة"><div class="map-world" id="map-world"><svg viewBox="0 0 390 270" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="map-blocks" width="80" height="65" patternUnits="userSpaceOnUse"><rect width="80" height="65" fill="#eaf0e2"/><rect x="6" y="6" width="59" height="43" rx="6" fill="#dfe7d4"/><path d="M0 58h80M73 0v65" stroke="#fff" stroke-width="9"/></pattern></defs><rect width="390" height="270" fill="url(#map-blocks)"/><path d="M-30 70q200 130 440 78" fill="none" stroke="#fafcf6" stroke-width="21"/><path d="M120 -20 190 285" stroke="#fcfdf8" stroke-width="18"/><path d="M70 212h82l-21-82h142l-9-56" fill="none" stroke="#d5f6a6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 212h82l-21-82h142l-9-56" fill="none" stroke="#285c40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/><circle cx="70" cy="212" r="15" fill="#244f38" stroke="#f3ffe6" stroke-width="4"/><path d="m63 214 7-12 7 12-7-3Z" fill="#dbffac"/><circle cx="264" cy="74" r="29" fill="#c8e5a566"/><path d="M264 49c-12 0-21 8-21 20 0 15 21 35 21 35s21-20 21-35c0-12-9-20-21-20" fill="#224e37" stroke="#f2fadd" stroke-width="3"/><circle cx="264" cy="69" r="6" fill="#d9faab"/></svg></div><span class="map-label">خريطة توضيحية · ليست ملاحة</span><div class="map-zoom"><button class="icon-button" data-action="zoom-in" aria-label="تكبير الخريطة التوضيحية">${I('plus')}</button><button class="icon-button" data-action="zoom-out" aria-label="تصغير الخريطة التوضيحية">${I('minus')}</button></div><div class="map-bubble">${I('pin')}<div>موقع العميل<small>المسار والمسافة للتجربة</small></div></div></div>`;}
  function route(j){return `${heading('في الطريق إلى اللمعة.','حدّث حالة الوصول بعد التوقف بأمان.','route')}${mapMarkup()}<div class="route-stats"><div class="metric"><small>وقت طريق توضيحي</small><strong>${j.eta}<span class="small"> دقيقة</span></strong></div><div class="metric"><small>المسافة التوضيحية</small><strong>${j.distance}<span class="small"> كم</span></strong></div></div><section class="card"><div class="detail-row" style="padding-top:0"><span class="tile-icon">${I('pin')}</span><div><strong>${escape(j.area)}</strong><p>${escape(j.address)}</p></div></div><p class="customer-note">${escape(j.note)}</p><button class="btn outline mt" data-action="contact">${I('phone')}التواصل مع العميل</button></section><div class="note mt">${I('info')}<span>لن يُفتح مسار حقيقي أو تُرسل إحداثيات. في التطوير الفعلي تُربط هذه الشاشة بخرائط وموقع مصرح بهما.</span></div>`;}
  function photoMarkup(p,phase){if(!p)return '';return p.kind==='local'?`<img src="${p.data}" alt="${phase==='before'?'قبل':'بعد'} الغسيل · صورة من الجهاز">`:sceneArt('exterior',phase==='before');}
  function photos(j,phase){
    const count=j.photos[phase].filter(Boolean).length; const before=phase==='before';
    return `${heading(before?'قبل اللمعة.':'دع النتيجة تتحدث.',before?'وثّق حالة السيارة. صورة واحدة على الأقل للمتابعة.':'أعد التصوير من الزاوية نفسها لمقارنة أوضح.','camera')}
    <div class="row between" style="margin-bottom:13px"><strong class="small">${before?'صور قبل الغسيل':'صور بعد الغسيل'}</strong><span class="pill ${count?'success':'neutral'}">${count} / 2 صور</span></div>
    <div class="photo-grid">${[0,1].map(index=>{const p=j.photos[phase][index];return `<div class="photo-card"><div class="photo-frame">${p?photoMarkup(p,phase):`<div class="photo-placeholder">${I('camera')}<span>${index?'زاوية إضافية':'الزاوية الرئيسية'}</span></div>`}${p?`<span class="photo-label">${p.kind==='demo'?'رسم تجريبي':'صورة محلية'}</span><span class="photo-badge">${I('check')}</span>`:''}</div><div class="photo-controls"><span><strong>${index?'زاوية إضافية':'الزاوية الرئيسية'}</strong><small>${index?'اختيارية':'صورة واحدة تكفي'}</small></span><button class="icon-button" data-action="photo-options" data-phase="${phase}" data-index="${index}" aria-label="${p?'خيارات صورة':'إضافة صورة'} ${index+1} ${before?'قبل':'بعد'} الغسيل">${I(p?'more':'plus')}</button></div></div>`}).join('')}</div>
    <label class="upload mt ${photoBusy?'processing':''}"><input class="input-hidden" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" data-upload="${phase}" ${photoBusy?'disabled':''}>${I('camera')}<span><strong>${photoBusy?'جارٍ تجهيز الصورة…':'التقط صورة أو اختر من الجهاز'}</strong><small>JPEG · PNG · WebP — حتى 10 ميغابايت</small></span></label>
    <button class="btn soft mt" data-action="demo-photos" ${photoBusy?'disabled':''}>${I('image')}أضف صورًا توضيحية للتجربة</button><div class="note mt">${I('shield')}<span>استأذن العميل قبل التصوير وتجنب الوجوه والمارة. الصور تبقى محليًا في هذا النموذج؛ لا تُرسل إلى عميل أو خادم.</span></div>
    ${before?`<label class="field-label" for="condition-note">ملاحظة عن حالة السيارة <span class="muted">· اختياري</span></label><textarea id="condition-note" data-input="condition" placeholder="مثلًا: خدش موجود مسبقًا على الباب…" maxlength="800">${escape(j.notes)}</textarea><p class="field-hint">تُحفظ الملاحظة محليًا، دون إرسالها للإدارة.</p>`:count&&j.photos.before.some(Boolean)?`<div class="section-title"><h2>لمعتك في مقارنة</h2><span class="tiny muted">اسحب الفاصل</span></div>${comparison(j)}`:''}`;
  }
  function wash(j){const checks=checkList(j);return `${heading('كل تفصيلة، بعناية.','أنجز القائمة ثم وثّق النتيجة. لا تعتمد على مؤقّت وحده.','spark')}<section class="progress-card row between" style="--percent:${j.checks.length/checks.length*100}%"><div><h2>${escape(j.service)}</h2><p>${j.checks.length} من ${checks.length} خطوات تم تأكيدها</p><span class="timer-label">${I('clock','small')}<span>${j.minutes} دقيقة للخدمة · تقديري</span></span></div><div class="progress-ring"><strong>${Math.round(j.checks.length/checks.length*100)}<small>%</small></strong></div></section><div class="section-title"><h2>قائمة العناية</h2><small>اضغط بعد الإنجاز</small></div><ul class="checklist">${checks.map((item,index)=>`<li><button class="check-button ${j.checks.includes(index)?'checked':''}" role="checkbox" aria-checked="${j.checks.includes(index)}" data-action="check" data-index="${index}" data-focus="check-${index}"><span class="check-circle">${I('check')}</span><span class="grow"><strong>${item.name}</strong><small>${item.desc}</small></span><span class="task-icon">${I(item.icon)}</span></button></li>`).join('')}</ul>${j.extra?`<div class="note mt">${I('plus')}<span><strong>${escape(j.extraName)}</strong><br>لا تنس الإضافة المتفق عليها ضمن عناية الإطارات.</span></div>`:''}<button class="text-btn full mt" data-action="before-view">${I('image')}عرض صور الحالة قبل الغسيل</button>`;}
  function comparison(j){
    const before=j.photos.before.find(Boolean),after=j.photos.after.find(Boolean);
    if(!before||!after)return '<div class="note">لا توجد صورتان للمقارنة في هذه المهمة.</div>';
    return `<div class="compare" id="comparison" style="--split:52%"><div class="scene-layer after">${photoMarkup(after,'after')}</div><div class="scene-layer before">${photoMarkup(before,'before')}</div><span class="compare-label before">قبل</span><span class="compare-label after">بعد</span><div class="compare-divider"><div class="compare-handle">${I('left','small')}${I('right','small')}</div></div><label class="sr" for="compare-range">حرك الفاصل لمقارنة قبل الغسيل وبعده</label><input class="compare-range" id="compare-range" type="range" min="0" max="100" value="52" dir="ltr" aria-valuetext="قبل 52 بالمئة، بعد 48 بالمئة"></div><div class="compare-caption"><span>${before.kind==='demo'||after.kind==='demo'?'يتضمن رسومًا توضيحية لا نتائج فعلية':'صورتان من جهازك · محليًا فقط'}</span><button class="text-btn" data-action="reveal">${I('play')}شاهد التحوّل</button></div>`;
  }
  function handoff(j){
    if(j.method==='cash')return `${heading(collected(j)?'وصل المبلغ، بقي التسليم.':'اللمعة اكتملت. وقت التسليم.',collected(j)?'تم تسجيل استلام الكاش تجريبيًا. يمكنك الآن إغلاق المهمة.':'تأكد من تسليم السيارة ثم سجّل التحصيل أو تعذّره.','banknote')}<section class="cash-hero"><span class="tile-icon lime">${I(collected(j)?'check':'banknote')}</span><p>${collected(j)?'كاش مسجّل في التجربة':'المبلغ المطلوب بعد الغسيل'}</p><strong class="amount">${money(total(j))}</strong><p>قيمة الطلب كاملة · وليست أرباح الفني</p><span class="pill ${collected(j)?'success':''}">${collected(j)?'تم التحصيل تجريبيًا':'لم يُسجّل التحصيل بعد'}</span></section><section class="receipt mt"><div class="receipt-row"><span>السيارة</span><strong>${escape(j.car)}</strong></div><div class="receipt-row"><span>المهمة</span><strong class="ltr">${j.id}</strong></div><div class="receipt-row"><span>الخدمة</span><strong>اكتمل الغسيل</strong></div><div class="receipt-row"><span>الدفع</span><strong>${collected(j)?'كاش مسجّل محليًا':j.cashIssue?'متابعة تحصيل مطلوبة':'بانتظار استلام الكاش'}</strong></div></section>${j.cashIssue?`<div class="note amber mt">${I('flag')}<span>سبب عدم التحصيل: ${escape(j.cashIssue)}. محفوظ محليًا ولم يُرسل.</span></div>`:''}<div class="note mt">${I('shield')}<span>اكتمال الغسيل لا يُثبت استلام النقود. سجّل التحصيل فقط بعد الاستلام؛ لن تنفذ هذه النسخة أي معاملة مالية.</span></div><button class="text-btn full mt" data-action="result-preview">${I('image')}عرض صور قبل وبعد</button>`;
    return `${heading('الخدمة مكتملة، والدفع مستقل.',j.payment==='verified'?'اعتماد الدفع في هذه المهمة مفترض لعرض السيناريو فقط.':'التحويل قيد المراجعة؛ الفني لا يعتمد مدفوعات المحافظ.','shield')}<section class="cash-hero" style="background:${j.payment==='pending'?'#fbf4e4':'#e8f3da'}"><span class="tile-icon ${j.payment==='pending'?'amber':'lime'}">${I(j.payment==='pending'?'clock':'check')}</span><p>${paymentLabel(j)}</p><strong class="amount">${money(total(j))}</strong><span class="pill ${j.payment==='pending'?'amber':'success'}">${j.payment==='pending'?'بانتظار مطابقة الإدارة':'معتمد · سيناريو تجريبي'}</span></section><div class="note ${j.payment==='pending'?'amber':''} mt">${I('info')}<span>${j.payment==='pending'?'لا تطلب تحويلًا جديدًا أو كاشًا بدلًا منه قبل مراجعة الإدارة؛ قد يكون العميل قد دفع فعلًا. إغلاق المهمة لن يحوّل الدفع إلى «مدفوع».':'الفني يعرض الحالة فقط. في التطبيق الفعلي يأتي الاعتماد من الخادم بعد التحقق، وليس من هذا الجهاز.'}</span></div>${j.payment==='pending'?`<button class="btn soft mt" data-action="payment-followup">${I('message')}تسجيل ملاحظة لمتابعة الدفع</button>`:''}<button class="text-btn full mt" data-action="result-preview">${I('image')}عرض صور قبل وبعد</button>`;
  }
  function completed(j){
    if(j.issue==='deferred')return `${heading('أُعيدت المهمة للجدول.','محاكاة طلب إعادة الإسناد؛ لم تُرسل إلى الإدارة فعليًا.','history')}<div class="note amber">${I('info')}<span>لم يُنفذ الغسيل ولم يُسجّل تحصيل. أُخفيت المهمة من القائمة النشطة في هذا العرض.</span></div><button class="btn outline mt" data-action="history">عرض سجل المهمة</button>`;

  function renderTasks(){const active=S.jobs.filter(j=>j.stage!=='closed');const done=S.jobs.filter(j=>j.stage==='closed');const follow=S.jobs.filter(j=>j.issue||j.cashIssue||j.stage==='closed'&&outstanding(j));const shown=taskFilter==='active'?active:taskFilter==='done'?done:follow;return `${heading('مهامك، بوضوح.','جدول مسند من الإدارة. كل البيانات هنا للتجربة.','calendar')}<div class="segmented" role="group" aria-label="تصفية المهام">${[['active','نشطة',active.length],['done','منتهية',done.length],['follow','متابعة',follow.length]].map(([key,name,n])=>`<button class="segment" aria-pressed="${taskFilter===key}" data-action="task-filter" data-value="${key}" data-focus="filter-${key}">${name}<small>${n}</small></button>`).join('')}</div>${shown.length?shown.map(j=>jobCard(j)).join(''):`<div class="empty"><span class="tile-icon">${I('calendar')}</span><h3>لا توجد مهام في هذه القائمة</h3><p>تتغير القوائم عندما تتقدم في سيناريوهات التجربة.</p><button class="btn soft" data-action="filter-active">عرض المهام النشطة</button></div>`}`;}
  function renderCollections(){const cash=S.jobs.filter(collected).reduce((sum,j)=>sum+total(j),0);const wallets=S.jobs.filter(j=>j.method!=='cash'&&j.payment==='verified'&&j.stage==='closed'&&j.issue!=='deferred');const follow=S.jobs.filter(j=>j.stage==='closed'&&outstanding(j)&&j.issue!=='deferred');const shown=S.jobs.filter(j=>j.stage==='closed'&&j.issue!=='deferred').filter(j=>collectionFilter==='cash'?collected(j):collectionFilter==='follow'?outstanding(j):true);return `${heading('التحصيل، دون التباس.','الأرقام تعكس محاكاة المهام، وليست حسابًا ماليًا فعليًا.','wallet')}<section class="ledger-hero"><div class="row between"><strong>الكاش المسجّل</strong>${I('banknote')}</div><span class="amount">${money(cash)}</span><p>قيمة طلبات محصّلة في العرض · ليست أرباح الفني</p></section><div class="stats-grid"><div class="metric"><small>محافظ · مهام مكتملة ومعتمدة</small><strong>${money(wallets.reduce((a,j)=>a+total(j),0))}</strong></div><div class="metric"><small>مهام مكتملة والدفع للمتابعة</small><strong>${follow.length}<span class="small"> مهام</span></strong></div></div><div class="segmented" role="group" aria-label="تصفية التحصيل">${[['all','كل المكتمل'],['cash','كاش محصّل'],['follow','متابعة']].map(([key,name])=>`<button class="segment" aria-pressed="${collectionFilter===key}" data-action="collection-filter" data-value="${key}">${name}</button>`).join('')}</div>${shown.length?shown.map(j=>`<section class="card" style="margin-bottom:12px"><div class="row"><span class="tile-icon ${outstanding(j)?'amber':'lime'}">${I(outstanding(j)?'clock':'check')}</span><div class="grow"><strong>${escape(j.car)}</strong><div class="tiny muted">${j.id} · ${paymentLabel(j)}</div></div><strong>${money(total(j))}</strong></div><div class="row between mt">${paymentPill(j)}<button class="text-btn" data-action="open-job" data-id="${j.id}">التفاصيل ${I('left')}</button></div></section>`).join(''):`<div class="empty"><span class="tile-icon">${I('receipt-pay')}</span><h3>لا توجد حركات مكتملة هنا</h3><p>أكمل مهمة تجريبية وشاهد حالة التحصيل بوضوح.</p><button class="btn soft" data-action="home">الذهاب إلى المهام</button></div>`}<div class="note mt">${I('shield')}<span>الفني لا يملك زر اعتماد شام كاش أو سيريتل كاش. حالة المحفظة مفترضة في بيانات العرض؛ الربط الحقيقي يأتي لاحقًا.</span></div>`;}
  function renderProfile(){return `<section class="profile-head"><div class="avatar">أح</div><h1>أحمد · الفني التجريبي</h1><p>WashGo · فريق العناية المتنقلة</p><span class="pill mt">حساب عرض · دون تسجيل دخول حقيقي</span></section><section class="card"><div class="setting-row"><span class="tile-icon">${I('spark')}</span><div class="grow"><strong>المؤثرات الحركية</strong><small>${reducedQuery.matches?'إعداد تقليل الحركة في الجهاز له الأولوية':'استجابة عند الاختيار وانتقالات هادئة'}</small></div><button class="switch" role="switch" aria-checked="${S.motion}" data-action="motion" aria-label="المؤثرات الحركية"><span class="switch-track"></span></button></div><div class="setting-row"><span class="tile-icon">${I('shield')}</span><div class="grow"><strong>البيانات على جهازك</strong><small>${storageOK?'الحفظ المحلي متاح في هذا المتصفح':'ذاكرة الجلسة فقط · الحفظ غير متاح'}</small></div></div></section><section class="card mt" style="padding-block:2px"><button class="menu-row" data-action="guide">${I('play')}<span class="grow"><strong>دليل التجربة</strong><small>كيف تختبر المهمة والكاش والمحافظ؟</small></span>${I('left')}</button><button class="menu-row" data-action="privacy">${I('lock')}<span class="grow"><strong>الخصوصية وحدود النموذج</strong><small>لا رفع للصور أو إرسال للطلبات.</small></span>${I('left')}</button><button class="menu-row" data-action="feedback">${I('edit')}<span class="grow"><strong>ملاحظات اعتماد التصميم</strong><small>اكتب ملاحظاتك ونزّلها كملف.</small></span>${I('left')}</button></section><section class="card mt"><h3>إدارة بيانات العرض</h3><p class="small muted" style="margin:7px 0 12px">إعادة البدء تحذف صور ومهام هذا النموذج فقط، ولا تعدّل نموذج العميل.</p><button class="btn danger" data-action="reset">${I('refresh')}إعادة ضبط التجربة</button></section><div class="design-footer">WASHGO · TECHNICIAN · DESIGN APPROVAL V1</div>`;}
  function showSheet(title,body,context={}) {
    stopReveal();
    if(sheet.open) sheet.close();
    sheetReturn = document.activeElement;
    sheetContext = {...context,id:context.id||selectedId};

    $('#sheet-body').scrollTop=0;

  function closeSheet(){if(sheet.open)sheet.close();sheetContext=null;stopReveal();}
  sheet.addEventListener('close',()=>{stopReveal();if(sheetReturn?.isConnected)sheetReturn.focus({preventScroll:true});});
  sheet.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || !sheet.open) return;
    const focusable = $$('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])', sheet)
      .filter(el => el.getClientRects().length && !el.closest('[hidden]') && getComputedStyle(el).visibility !== 'hidden');
    if (!focusable.length) { e.preventDefault(); return; }
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  });
  sheet.addEventListener('click', e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)closeSheet();}});
  function showGuide(){showSheet('جرّب يوم الفني',`<div class="note">${I('info')}<span>نموذج اعتماد بصري مستقل. جميع الطلبات محلية وتوضيحية، ولن تصل إشعارات إلى أي عميل.</span></div><ol class="timeline"><li><span class="tile-icon">${I('work')}</span><div><strong>افتح أول مهمة ثم استلمها</strong><small>ابدأ التوجّه وأكّد الوصول إلى الموقع.</small></div></li><li><span class="tile-icon">${I('camera')}</span><div><strong>أضف صورًا قبل الغسيل وبعده</strong><small>استخدم زر الصور التوضيحية أو صورًا من الجهاز. أكمل قائمة العناية بينهما.</small></div></li><li><span class="tile-icon">${I('banknote')}</span><div><strong>جرّب الكاش ومتابعة المحفظة</strong><small>الأولى كاش، الثانية شام كاش قيد المراجعة، الثالثة سيريتل كاش معتمد في بيانات العرض.</small></div></li><li><span class="tile-icon">${I('check')}</span><div><strong>أغلق المهمة وشاهد النتيجة</strong><small>صور قبل/بعد وسجل المهمة وحالة التحصيل.</small></div></li></ol><p class="muted">الأسعار والمسافات والمواعيد افتراضية وليست تسعيرًا أو ملاحة حقيقية. لا تُدخل بيانات مالية أو معلومات عميل حقيقي.</p><button class="btn" data-action="close-sheet">ابدأ التجربة ${I('arrow')}</button>`);}
  function showBreakdown(j){showSheet('تفاصيل قيمة الطلب',`<section class="receipt"><div class="receipt-row"><span>${escape(j.service)}</span><strong>${money(j.base)}</strong></div><div class="receipt-row"><span>${j.extra?escape(j.extraName):'الإضافات'}</span><strong>${money(j.extra)}</strong></div><div class="receipt-row total"><span>الإجمالي التوضيحي</span><strong>${money(total(j))}</strong></div></section><div class="note mt">${I('info')}<span>هذه قيمة الخدمة للعميل، وليست أجرًا أو أرباحًا للفني. لا تُنشئ الأرقام فاتورة أو التزامًا ماليًا.</span></div><button class="btn soft" data-action="close-sheet">واضح</button>`);}

  function showCash(j){

  function digitValue(v){return String(v).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[,٬\s]/g,'');}

  function primary(){

    if(file.size>10*1024*1024){toast('الصورة أكبر من 10 ميغابايت. اختر صورة أصغر.');return;}
    if(file.size<20){toast('ملف الصورة فارغ أو غير صالح.');return;}
    photoBusy=true;const rev=photoRevision;closeSheet();refresh();
    try {
      const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('read'));reader.readAsDataURL(file);});
      const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('decode'));im.src=source;});
      if(img.naturalWidth*img.naturalHeight>40000000)throw new Error('dimensions');
      const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL('image/jpeg',.76);if(data.length>850000)throw new Error('too-big');
      if(rev!==photoRevision||j.stage!==phase)return;
      j.photos[phase][index]={kind:'local',data};record(j,`إضافة صورة محلية ${phase==='before'?'قبل':'بعد'} الغسيل`);persist();
      toast(storageOK?'تم تجهيز الصورة وحفظها على هذا المتصفح.':'الصورة جاهزة في الجلسة فقط؛ الحفظ المحلي غير متاح.');
